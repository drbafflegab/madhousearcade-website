<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>player</title>
<style>
  /* Every colour on this page is one of these, and the page rewrites them from
     the game's own palette once the module is read - see `applyTheme` below.
     The values here are the fallback and nothing more: they are what a reader
     sees before a module has been loaded, and what stays on screen when the
     load is refused. They are the dark chrome this page had before a game could
     choose, so a refusal still looks like the player rather than like nothing.

     Named for their role rather than their colour, because after the first
     frame they are whatever the game said. */
  :root {
      color-scheme: dark;
      --surround: #0b0b12;
      --ink: #c8c8d4;
      --dim: #6a6a80;
      --panel: #1a1a24;
      --hover: #23232e;
      --edge: #2e2e3c;
      --alarm: #e06c6c;
  }
  * { box-sizing: border-box; }
  /* `safe` is what makes zooming IN work. Centred flex content that outgrows
     its container overflows equally in both directions, so the top and left of
     an oversized canvas end up off-screen with no scroll that reaches them -
     and zooming in past the window is now an ordinary thing to do, because a
     zoom no longer refits. `safe` centres while there is room and aligns to the
     start once there is not. The plain `center` above it is the fallback: a
     browser that does not know the keyword drops the whole declaration, so it
     has to be given one it does know first. */
  /* `overscroll-behavior` stops the rubber band, which on a touch device reads
     as the whole page sliding a centimetre under a gesture meant for the game.
     It stops the BOUNCE rather than scrolling itself, which matters: zooming in
     can legitimately make the canvas taller than the window, and the page has
     to stay scrollable to reach it. `overflow: hidden` would have fixed the
     bounce and taken that with it. */
  html, body { overscroll-behavior: none; }
  /* `dvh` is why this page used to scroll a little on a phone with nothing to
     scroll to. On iOS `vh` is the LARGE viewport - the one measured with the
     browser's toolbars collapsed - so a body sized in it stands taller than the
     window by the toolbar's height for as long as the toolbar is showing, and
     the page offers exactly that much slack. `dvh` follows the viewport that is
     actually there.

     The `vh` line stays underneath it for anything that does not know the unit,
     which then gets the old behaviour rather than no height at all. */

  /* NO PADDING, which is a measurement rather than a taste. The canvas is a
     whole multiple of 240 device pixels, so every pixel the page keeps for
     itself is spent in steps of a whole scale - and a 20px surround is exactly
     what stood between several real devices and a step larger game. Their own
     viewports, run through `canvasScale`: an iPhone SE drew at 2 with the
     padding and draws at 3 without, a 15 Pro Max at 4 and now 5, an iPad mini
     at 5 and now 6, each of them decided by the width rather than the height,
     so a toolbar cannot change the reading. Where it buys no step it costs
     nothing either: the leftover of a whole multiple is centred slack, and the
     total space around the game is the same however it is divided.

     The page measures this rather than knowing it - `available` below reads
     the computed padding, so this line is the only place the number lives, and
     a surround put back here is one the fit will see.

     The chrome keeps a margin of its own, on the row instead of on the page:
     `#hud` carries the horizontal padding now, so a legend on a narrow phone
     still stands off the edge while the canvas above it no longer has to. */
  body {
      margin: 0;
      min-height: 100vh; min-height: 100dvh;
      background: var(--surround); color: var(--ink);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex; flex-direction: column; gap: 14px; padding: 0;
      align-items: center; justify-content: center;
      align-items: safe center; justify-content: safe center;
  }
  /* `touch-action: none` is not decoration: without it the first drag across
     the canvas scrolls the page instead of playing the game, and on a phone
     that is every gesture a pointer game is made of. It is not the whole of
     that story either: iOS zooms the page on a double tap over the screen in
     spite of this declaration, and the script below refuses that gesture where
     the declaration is ignored.

     No border and no radius, and what that gives up is worth stating. The
     page's background is the game's own `background` entry, so on a game
     pointing it at the colour it fills its screen with - four of the six here -
     there is now nothing at all saying where the console ends, and the screen
     runs into the page. For those that is the effect rather than the cost:
     `games/asteroids` has space on both sides of that line. A game wanting the
     console to read as an object declares a surround its screen does not use,
     which is what `games/pong` and `games/suika` do. */
  #screen {
      image-rendering: pixelated; background: #000;
      display: block; touch-action: none;

      /* iOS answers a long press on an element it thinks is content by
         selecting it and raising the copy callout. That is a nuisance on any
         game and an outright conflict on one whose OWN long press is a move:
         `games/minesweeper` marks a mine by holding half a second on a cell, so
         the browser's gesture and the game's fire on the same finger. The
         callout wins, and the mark never happens.

         Three properties rather than one, because they are three behaviours:
         the callout is the menu, `user-select` is the blue selection under it,
         and the tap highlight is the grey flash iOS paints on anything it
         thinks was tapped. None of them can mean anything over a framebuffer.

         Scoped to the canvas rather than the page, so the text in the row below
         can still be selected and copied. */
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
  }
  #hud { display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
         justify-content: center; min-height: 20px; padding: 0 12px; }
  /* Said again here because the rule above would otherwise silently beat it: an
     author `display: flex` outranks the UA stylesheet's `[hidden] { display:
     none }` whatever the specificity, so without this line the attribute the
     page sets on the row does nothing at all. */
  #hud[hidden] { display: none; }
  /* The legends are written by the script rather than by this file, so they
     need a container to be written into - and a container would be one flex
     item holding two legends where the row wants two items with the row's own
     gap between them. `display: contents` drops the box and leaves the children
     to the row, which is what makes a derived legend sit exactly where a
     literal one used to. */
  #legends { display: contents; }
  kbd { background: var(--panel); border: 1px solid var(--edge);
        border-radius: 3px; padding: 1px 5px; color: var(--dim); }
  button { background: var(--panel); color: var(--ink);
           border: 1px solid var(--edge);
           border-radius: 3px; padding: 4px 10px; cursor: pointer;
           font: inherit; }
  button:hover { background: var(--hover); border-color: var(--edge); }
  .dim { color: var(--dim); }
</style>
</head>
<body>

<canvas id="screen" width="240" height="240"></canvas>

<!-- The only thing under the canvas, and it starts hidden - in the markup
     rather than from the script, so the page never paints it and then takes it
     away. `I` toggles it; `showChrome` below says what that costs the canvas
     and why a refusal overrides it.

     Controls and legends, and nothing read out of the running game EXCEPT what
     it says it reads: every reading this page used to carry is gone, the last
     of them a steps-per-second gauge that the accumulator pinned at 60 whenever
     the machine was keeping up. The legends are `kbd` rather than buttons
     because they name the CONSOLE's buttons, which the page cannot press;
     everything after them is the page's own and each carries its key in its
     label, so there is one place to learn a shortcut rather than a legend
     beside a control that already said it.

     `legends` is empty here and filled by `fillLegends` from the module's own
     `Game_Controls`, so a game is advertised the input it actually reads and
     nothing else. Empty rather than seeded with the pad's two: the page does
     not know what the game reads until it has read the module, and a legend
     painted and then taken away is worse than one that arrives with the game.
     A refusal never fills it, and that is right - a page that will not play has
     no controls to name. -->

<div id="hud" hidden>
  <span id="legends"></span>
  <button id="pause">Pause (Enter)</button>
  <button id="hide">Hide Information (I)</button>
  <button id="mark">Mark frame (M)</button>
  <button id="reset">Reset (R)</button>
  <button id="full">Fullscreen (F)</button>
</div>

<!-- The player's browser-free half, and everything below this line is the
     browser's: the canvas ELEMENT and its box, the audio context, the listeners
     and the store. The picture is drawn two threads away, in
     `render.worker.js`, into a canvas this page transfers to it once per run.
     Loaded as a classic script so that its declarations are in scope for the
     inline one that follows.

     `products/web-player/source/player.js` says why the split is where it is
     and what runs the far side of it without a browser. -->

<script src="player.js"></script>

<script>
"use strict";

// Where a refusal is SHOWN is the page's, so the page installs it; the console
// line and the throw are `player.js`'s, because neither is the browser's.
//
// The HUD is looked up on each refusal rather than captured here, because a
// refusal can happen while the module is being read, which is before the const
// below exists.

// A named function rather than the arrow it used to be, because a refusal is no
// longer the only thing with a sentence to put here. The watchdog below has one
// too and it must not throw - a run that has already stopped needs no exception
// unwinding a callback - so the two share the banner and differ in what happens
// after it.

function showAlarm (reason) {
    const banner = document.getElementById ("hud");

    if (! banner) { return; }

    // Revealed, because the HUD starts hidden and a banner nobody can see is
    // the same as no banner: a page that refused would otherwise be a blank
    // canvas and nothing else. The attribute is set here rather than through
    // `showChrome`, for the same reason the element is looked up here rather
    // than captured above - a refusal can arrive while the module is being
    // read, which is before `canvas` and `scaleLabel` exist, and `showChrome`
    // reaches both through `fitCanvas`. That would replace the message with a
    // ReferenceError from inside the handler meant to deliver it.
    banner.hidden = false;

    banner.textContent = "player: " + reason;
    banner.style.color = "var(--alarm)";
}

onRefusal (showAlarm);

// ---------------------------------------------------------------------------
// Which game this is.
//
// `player.html?module=<url>`, and `&resources=<directory>` beside it when the
// bytes are not the ones built beside that module. The player knows nothing
// about where games live: it plays whatever module URL it is handed, exactly as
// `inspector` opens whatever module path it is given, so one published page
// plays every game in the tree and every game outside it.
//
// The module URL is resolved against the PAGE, and everything the module needs
// is then resolved against the MODULE - see `resourceBase` in `player.js`.
// Those are two different directories whenever the page is not sitting beside
// the game, which is the normal case now that there is one page rather than a
// copy per game.
//
// `resources=` is the exception and is resolved against the PAGE too, because
// it is the caller's answer rather than the module's: `resourceBase` in
// `player.js` holds that rule, the site-relative resolution it needs to survive
// being served from a subdirectory, and the five values it refuses.
//
// `module` and `resources` are the whole of what this page KEEPS. EVERY OTHER
// KEY IS THE GAME'S and is passed through as a `Game_Arg` pair: nothing on a
// module says a word about arguments in advance, so there is no declaration to
// match a key against and a key this game has never heard of is not an error -
// it is a key for a harness, for a menu, or for the next version of the game,
// and the run starts regardless. That is why the two above are listed rather
// than left to be inferred from what happens to be read here.
//
// `seed` is this host's own term and is NOT one of them: it rides the query as
// an ordinary pair and the rulebook takes it back out below, so one grammar
// carries it from an address bar and a command line alike.
// ---------------------------------------------------------------------------

const query = new URLSearchParams (location.search);

const moduleUrl = query.get ("module");

if (! moduleUrl) {
    refuse ("no module. Open this page as player.html?module=<url>, where "
        + "<url> names a game's <name>.wasm, relative to this page or "
        + "absolute. Add &resources=<directory> to play it against bytes "
        + "that are not the ones beside it.");
}

// Resolved once, here, so that a URL this page cannot make sense of is a
// refusal naming it rather than a TypeError from whichever line reached for it
// first.
const moduleBase = resolve (moduleUrl);

function resolve (url) {
    try {
        return new URL (url, location.href);
    } catch {
        refuse (`module=${url} is not a URL this page can resolve against `
            + `${location.href}.`);
    }
}

// Resolved here rather than at every `reset`, for the reason above and one
// more: a bad value should refuse the page once, before a module is fetched,
// rather than on whichever reset happened to be the first to want a file.
const resourceDirectory = resourceBase (moduleBase, location.href,
    query.get ("resources"));

// ---------------------------------------------------------------------------
// Which run this is, and the address that says so.
//
// Decided once, here, rather than at every `reset`. A roll per reset would make
// R a different game each time, which is not what resetting a game means, and
// would leave the address bar describing only the first run the page played.
//
// `composeRun` is handed all three of the things this page can reach that
// `player.js` may not - `Math.random`, the clock, and the browser's own
// `history` - and it composes what the query did not carry: a seed where none
// was named, a day where none was named, MERGED into what was there and written
// back through `replaceState`, which rewrites the address with no navigation
// and no history entry. It is a relative reference, so nothing here needs to
// know where the site is mounted. A bare link is therefore a fresh game, and
// the moment it loads the address bar holds the run that is on screen.
//
// THE RUN IS READ OUT OF THE QUERY THAT COMPOSER ANSWERED, which is the one
// ordering decision here and is what keeps a page from playing one run while
// displaying another. So `runQuery` rather than `location.search` is what
// `start` below reads the seed and the pairs out of - and a recording written
// later carries the number that was rolled by construction rather than by a
// rule somebody has to remember.
// ---------------------------------------------------------------------------

const runQuery = composeRun (location.search, Math.random, new Date (),
    history);

// ---------------------------------------------------------------------------
// What this browser remembers about this game.
//
// `localStorage`, keyed by the module's own declared name - `SaveStore` in
// `player.js` holds the key, the one spelling a blob has and the ladder that
// discards every defect to zeros. What is here is only the browser's half of
// it, because reaching for `localStorage` at all is what a browser can refuse.
//
// It THROWS rather than answering nothing where storage is disabled, or where
// a page is embedded under a policy that partitions it - so the property access
// is inside the guard rather than beside it, and a page that cannot have a
// store plays and forgets instead of refusing to start. That is the same
// judgement the discard ladder is written around: nobody would be told, and a
// lost score is smaller than a blank canvas.
// ---------------------------------------------------------------------------

const saveStore = (() => {
    try { return new SaveStore (localStorage); }
    catch { return null; }
}) ();

// The seed and the rest of what this run was told, decided in `start` rather
// than here.
//
// `runSeed` is a number by the time anything reads it: `queryArguments` answers
// `null` for a query that named no seed, and `runQuery` above cannot be one -
// the composer wrote a number into it wherever the address had none.
//
// Every key that is not one of this page's own becomes a pair, held to the
// format a recording and a session need and to nothing else - and nothing about
// that waits for the GAME, because there is nothing on a module to wait for. It
// waits for the RULEBOOK: the charset, the two lengths, the reserved key, the
// duplicate and the sort are `products/host-core`'s, and this page fetches that
// module beside the trampoline. So the split is by which round trip rather than
// by which question, and the seed and the pairs a run was told are still
// decided once, out of the query the composer above answered, for the whole
// life of the page.
let runSeed = 0;
let runArguments = null;

// ---------------------------------------------------------------------------
// Audio. The game renders its own samples, ON THE AUDIO THREAD.
//
// There is no synthesiser here and no second implementation to keep in step
// with the CLI - `render_audio` runs inside the game's own wasm module, so the
// page and `inspector wav` are playing arithmetic that ran in the same code. A
// ctest renders every golden replay through both targets and compares the
// samples.
//
// WHAT MOVED, AND WHAT DID NOT. The simulation used to render each frame's 800
// samples and post them on, and the processor below was a queue of buffers. It
// is a CONSUMER now, in exactly the sense `player.js`'s `Consumer` is one: it
// holds its own instance of the game's module, it is handed the state block per
// step at the block's own address, and it calls the game's own `render_audio` on
// it inside `process`. So the host still synthesises nothing, `render_audio`
// still takes a `void const *`, and the playheads still live in the published
// state - `docs/decisions.md:169-171` are honoured by construction rather than
// by promise. What it buys is scheduling: tick N is 800 samples of the audio
// clock, rendered when the audio clock reaches it, by a producer that is not on
// the main thread at all.
//
// IT IS ONE OF TWO CONSUMERS, and the other draws. Neither is on this thread:
// the page held one for the picture once and painted from it, and the picture is
// two threads out now, in `render.worker.js`. What crosses to each is a
// description the simulation captured and each renders it with the game's own
// code - the sound per STEP, because a step's state is 800 samples of the audio
// clock and a step whose state was never published is a hole, and the picture
// per published FRAME, because a skipped picture is invisible.
//
// Measured constraints shape this, and every one is in
// `docs/runs/threaded-host-run.md` or `docs/decisions.md`:
//
// - `addModule` from a blob URL FAILS on file:// with AbortError, while a data:
//   URI works on both file:// and http://. The page is served now, so the blob
//   route would work here - the data: one is kept because it is the one that
//   works everywhere, and swapping it would buy nothing.
// - An AudioContext created without a user gesture starts suspended and stays
//   there, so the first gesture of any kind resumes it.
// - A `WebAssembly.Module` will NOT deserialize into an
//   `AudioWorkletGlobalScope`: posted to the port it arrives at
//   `onmessageerror`. The module's BYTES cross, and `new WebAssembly.Module`
//   compiles synchronously off the main thread - (c). So bytes are posted.
// - A `MessagePort` DOES cross, and a dedicated worker on the far end of one
//   feeds the audio thread with no main thread on the path - measured for this
//   milestone by `scratch/probes/port.sh`, three ticks from a worker straight
//   into a processor. That is what lets the simulation post its own ticks,
//   which is the whole of the latency argument: a page relaying them would put
//   the sound back on the thread the simulation left in order to escape.
// ---------------------------------------------------------------------------

// The processor's source, as text: it runs in its own global scope with no
// access to anything here, and an `AudioWorkletGlobalScope` cannot
// `importScripts`. So the FIGURES it needs are interpolated in below and the
// CODE it needs is written out inside it - the twenty-odd lines that do what
// `player.js`'s `Consumer` does, because that class cannot be reached from
// there. The offsets are interpolated rather than restated so that `LAYOUT` in
// `player.js` stays the one hand mirror of `Game` this player has: a third copy
// would be a third thing to move when a member is added at the tail.
const STATE_PLAYER = `
const SAMPLES_PER_FRAME = ${SAMPLES_PER_FRAME};

const GAME_RENDER_AUDIO = ${LAYOUT.game.renderAudio};
const GAME_AUDIO_STATE_SIZE = ${LAYOUT.game.audioStateSize};
const GAME_BYTES = ${LAYOUT.game.bytes};

// Game_Task_Reader's own two offsets and its size, interpolated with everything
// else so that LAYOUT in player.js stays the one hand mirror of Game this player
// has.
const READER_CONTEXT_AT = ${LAYOUT.reader.context};
const READER_BYTES_AT = ${LAYOUT.reader.bytes};
const READER_STRIDE = ${LAYOUT.reader.stride};

// And the sentinel this processor writes into its own record's context. A
// literal rather than an interpolation, and deliberately: the value is written
// here and read here, in one instance's own memory, so it never has to agree
// with the one player.js writes into the simulation's record. What it is for is
// telling this instance's record from anything else a game might pass back,
// which is a question with one asker.
const READER_CONTEXT = 0x30000000;

// How many TICKS of sound may be waiting to be rendered, which IS the latency:
// each is one 60 Hz frame, 800 samples, so a depth of three is 50 ms between a
// frame being stepped and being heard, plus whatever of a fourth the reader is
// already inside. The trim below runs on every message, so this is a TARGET
// rather than a disaster ceiling - a burst is cut straight back to it - and it
// is also the cushion the queue exists to be, because a producer and a consumer
// both running at 60 Hz hold whatever depth they were left at rather than
// returning to one.
//
// THREE IS A READING NOW RATHER THAN A JUDGEMENT, and the reading is the plan's
// own rule applied to docs/runs/threaded-host-run.md (b): the smallest N for
// which a producer gap longer than N ticks is rarer than p99.9, plus one,
// floored at two. A dedicated worker running a self-correcting setTimeout aimed
// at 16.667 ms, in headless Chrome 152 over 60 seconds, visible: n 3,598,
// p50 16.5 ms, p99 24.6, p99.9 25.6, max 26.1. Gaps longer than ONE tick are
// 1,621 of 3,598 - 45%, and arithmetic rather than jitter, since a producer
// aimed at exactly 60 Hz is over 16.667 ms about half the time by construction.
// Gaps longer than TWO ticks are 0 of 3,598. So N = 2, the depth is 3, and
// moving the producer off the page's animation frame bought no depth back.
//
// WHAT THAT READING CANNOT SEE, said beside it because a number with a figure
// next to it reads settled and this one is not. It was taken in headless
// Chrome, whose animation frame is a timer-driven fake vsync with a 0.3 ms
// spread over 3,600 frames - so it removes exactly the layout, collection and
// compositor jitter this design exists to escape, and a headed browser could
// move it. In the BACKGROUND the same timer is not a slow producer but a
// stopped one - p99.9 767 ms, max 1,584 ms, 293 gaps over two ticks in 60 s -
// which is why the page halts on hidden rather than buffering through it, and
// is not a depth any queue could be built to cover.
//
// The floor of two is the plan's and stands whatever a later reading says. One
// is too few twice over: a queue one tick deep is empty for part of every
// ordinary interval, and process below plays an empty queue as zeros, which is
// a click - and the processor now also has to run render_audio, 1.6 us measured
// on the audio thread, before the quantum that needs the samples. Eight, which
// is what this once was, is far too many: 133 ms that nothing gives back.
//
// It is fixed rather than adaptive, and that is the same sentence as the trim
// having no drain. There was a drain - a message that set the queue length to
// zero - and nothing in this tree ever posted one, so it went. Given a caller
// it would have been wrong rather than merely idle: the depth is the cushion as
// well as the latency, and two clocks at the same rate never rebuild a cushion
// they are robbed of, so a scheme that shrinks needs a way to grow back, and
// growing back is a lag controller this tree has deferred whole.
const QUEUE_TICKS = 3;

// The consumer, on the audio thread. It never calls construct and never calls
// step: what it holds is bytes it was handed plus whatever the module's own
// data segments put there, and what it runs on them is the game's own
// render_audio.
//
// It takes no imports, and it installs ONE thing: the trampoline, so that a
// sound description naming a task by id can be answered. A renderer calls no
// host function of its own accord - measured in
// docs/runs/threaded-host-run.md (a) over forty-four recordings and (c) inside
// this very scope - but a capture carries an id where a state block carried a
// pointer, and Game_Task_Reader is the one question that leaves. What it costs
// this scope is a second WebAssembly.Module compiled here, out of bytes rather
// than out of a module, for the reason the game's is: a Module will not
// deserialize into an AudioWorkletGlobalScope and bytes cross without
// complaint. It happens once per run, before anything is playing.
class StatePlayer extends AudioWorkletProcessor {
    constructor () {
        super ();

        // Ticks arrive from the simulation's own thread and are consumed on the
        // audio clock. A queue absorbs the difference. What it holds is state
        // blocks rather than samples now, and the entry for a tick a game
        // reported silent is the silence below - so an entry is one tick of
        // TIME whichever kind it is.
        this.queue = [];
        this.pending = null;
        this.pendingAt = 0;

        // One frame of zeros, for every tick a game reports as silent. The
        // length is the page's own constant, interpolated in with the rest of
        // this source, so a silent tick is exactly as long as a rendered one.
        //
        // Sharing one array across several queued ticks is safe because nothing
        // here ever writes to it and each entry is consumed on its own cursor,
        // so two entries that are the same array play as two frames of silence.
        // It doubles as the SENTINEL saying which kind an entry is, which is why
        // next below compares against it by identity.
        this.silence = new Int16Array (SAMPLES_PER_FRAME);

        // Where a rendered tick is copied to, once per tick. The game renders
        // into its own linear memory at the same address every time and
        // memory.grow detaches every view over a buffer, so a view kept across a
        // delivery would be a view of nothing; 800 shorts is 44 ns, measured.
        this.rendered = new Int16Array (SAMPLES_PER_FRAME);

        this.instance = null;
        this.renderAudio = null;
        this.states = null;

        // The task blocks this instance holds, by the id that names them, which
        // is the whole of what a reader here answers out of. An id rather than
        // an address because the simulation's arena recycles a block the moment
        // a release settles, so one address carries one task's answer and then
        // another's.
        this.blocks = new Map ();

        this.readerPtr = 0;
        this.readerArmed = false;

        // Where the sound description lands. Settled in open below and read
        // once per tick.
        this.description = 0;

        // The page opens a run: the module's bytes, the trampoline's bytes, the
        // addresses its simulation laid down, the regions laid down once, and
        // the port every tick will arrive on. It is the only thing the page
        // ever says here.
        this.port.onmessage = (message) => {
            this.open (message.data.bytes, message.data.trampolineBytes,
                message.data.layout, message.data.regions, message.data.port);
        };
    }

    // Enough linear memory for span bytes at at, which is the whole of what
    // this class does for itself: it lays no arena down, and every address it

// A FUNCTION RATHER THAN A RUN OF CALLS, because the element is per-run: a
// canvas is transferable once, so `freshCanvas` below replaces it on every reset
// and each replacement has to be given the seven listeners the last one had. A
// list written out at load would have armed the first element and left every
// element after it deaf, which is a game that cannot be clicked with nothing on

function armCanvas () {

    // line a mouse dragged off the canvas would go absent mid gesture where a
    // finger would not - two devices disagreeing at exactly the seam the header
    // promises they agree at.

// capturing it.
canvas.addEventListener ("pointerleave", event => {

// take it first, and only where the game reads a pointer: suppressing the menu
// over a game that never sees the click would take it from the player for
// nothing.

// answered. `touch-action: none` on the canvas is meant to settle it - the
// declaration says that no gesture beginning on the screen is the browser's -
// and Safari zooms the page a step on two quick taps over it anyway, which on a
// game whose taps ARE its input is every other move. What survives the
// declaration does not survive a refusal: the zoom is raised off the second
// `touchend`, so cancelling that one event is the whole fix, and it is scoped
// to the canvas and to a second tap rather than turned on the page.
//

// thing to do here - the `safe` alignment at the top of the page exists for it,
// and the sizing declines to refit on a zoom precisely so that a player who
// zoomed in stays zoomed in - so `user-scalable=no` in the viewport tag would

}

// The element the markup carries, so that a page which never reaches a module -
// a refusal, a fetch that never lands - is still a page whose canvas behaves.

armCanvas ();

// The next run's screen, in place of the one the last run was given.
//
// `transferControlToOffscreen` may be called once per element and the
// `OffscreenCanvas` it answers with goes to one worker and dies with it, so a
// reset that reused this element would be refused by the browser and a reset
// that reused the offscreen half has nothing to reuse. Replacing the element is
// the only door left, and it is a small one: the id carries the stylesheet, the
// style attribute carries the box `fitCanvas` last computed - width, height,

// which properties the page writes - and `armCanvas` gives the new element the
// listeners the old one had.

    next.id = canvas.id;
    next.width = FRAME_WIDTH;
    next.height = FRAME_HEIGHT;

// replacing it.
//
// `element` is the canvas the dead renderer was drawing into, already out of
// the document - `freshCanvas` above put the new one in its place - and still
// holding the last bitmap its worker committed. This pins it over exactly the
// box it was occupying and puts it back.
//

// `fitCanvas` wrote is cleared with it, because the rect already has that
// correction in it and applying both would move the picture twice.
//

    element.style.transform = "none";

// reset, and on any refit.
//

// box measured in viewport coordinates at one instant, so a window that changes
// size under it leaves a picture of the right game in the wrong place. A blank
// canvas for the rest of the window is the better of the two, and a refit is

// moving it, and nothing here has to keep a second box up to date.

// pixels rather than CSS ones, is `canvasScale` in `player.js` - the arithmetic

// like `pointerPixel` and the key table.
//

// be a hard coded 120px, which was wrong at both ends: the real chrome is 84px

// pixels of height, and the HUD wraps on a narrow one and grows past 150px.

const hud = document.getElementById ("hud");

// The part of that row the game decides. Looked up once beside the row it sits

const legendRow = document.getElementById ("legends");

    // one row is the case this arithmetic gets wrong when it is assumed.

// How far the page is zoomed is `pageZoom` in `player.js`, which takes the four
// numbers `reading` gathers and says what it does with a phone, where the outer
// pair is the screen rather than the window. It moved there when it stopped
// being a division: what a reading MEANS lives on the far side of this page's

    canvas.style.height = box.height + "px";

    // not, and `gridSnap` in `player.js` says what a box straddling the grid

    // back the last fit's answer and corrects a fraction that is already gone.

// and five page controls - none of it needed while playing, and every control
// carrying its key in its own label. `I` brings the lot back and `I` takes it

//

//
// What is genuinely lost while it is off is discoverability: `M`, `R`, `F`,

function toggleChrome () { showChrome (hud.hidden); }

// out enlarge the game, and leaving the canvas alone is what lets the browser's
// own control scale it like anything else on the page.
//
// The reading is kept rather than recomputed because the decision is a
// comparison of two moments, and only the page can take either of them - every
// number in it is a browser global.
//
// The media query is the second signal because a display change can move the
// ratio without a `resize` at all. It matches only at the ratio it was built
// with, so any move away fires it once and it is re-armed at the new one. Its

    ratioWatch.addEventListener ("change", onLayout);

// The first call has nothing to compare against, so it reports `window`, which
// both arms the query and lays the canvas out.

onLayout ();

// Fullscreen, which is the same `requestFullscreen` a video player calls: the
// real one, so the menu bar and the browser's own chrome go with it.
//
// It needs no arithmetic of its own. `available` MEASURES the chrome rather

//
// `documentElement` rather than `body`: the UA stylesheet puts width and height

// LEAVING IS NOT THE SAME OPERATION AND MUST NOT FORCE A REFIT, which is a bug

// `layoutChange` declining to refit on a zoom; forcing one here was the single

// zoom is declined for the same good reason. It is not one browser's problem:
// the box is `240 * scale / ratio`, so Chrome moving the ratio with a zoom
// cancels against the smaller multiple it then takes, and both land on 1680.
//

// and is still the right answer for it, and it carries the zoom it was measured

//

    // `textContent`, which takes the frame counter and all four buttons with

// The CSS box the canvas had while the page was a window, so that leaving

//

//

// The renderer's own run, opened the moment the simulation says where its arena

//

//

// used to take the run with it, because it ran on the thread that steps: the
// page's watchdog terminated the simulation and the session was over.
// `docs/archived/render-worker-plan.md` traded one display frame of latency for
// a renderer the page can replace, and this function is the whole of the second
// half of that trade.
//
// THE SIMULATION IS NEVER TOUCHED, and that is the gate the plan states rather
// than a nicety: it is not terminated, not reset, not paused and not asked
// anything, so its frame count goes on advancing across every line below. The
// one message it is sent is `viewer`, which is the message it already has for
// being told where to publish - and it is sent for a reason that is not
// bookkeeping. The thread on the far side of the old port is gone, and the
// simulation's record of which task blocks that consumer holds would otherwise
// keep every live block from ever being delivered to the new one;
// `sim.worker.js`'s own `viewer` case says what that would cost.
//
// THE ORDER IS THE ONE `seize` KEEPS, for the same reason: the wedged thread is
// ended first, because everything after it takes time a page whose main thread
// is fine can afford and a spinning core is not.
//
// A FRESH ELEMENT, because a canvas may be transferred once and the handle the
// old one gave away died with its worker. `freeze` above is what the player
// sees while the new one is still empty.

function replaceRenderer () {
    if (! sim || ! render || ! arena) { return; }

    // Measured before the element leaves the document, because a box is a fact
    // about where it was laid out and there is no reading it afterwards.
    const box = canvas.getBoundingClientRect ();
    const shown = canvas;

    render.terminate ();

    freshCanvas ();
    freeze (shown, box);

    screenHandle = canvas.transferControlToOffscreen ();

    // And a new channel, in both directions, exactly as `reset` makes the
    // first: the simulation starts publishing into it at once and the port
    // holds what the new worker has not drained, so the frames drawn while it
    // fetches and compiles are drawn rather than dropped.
    const channel = new MessageChannel ();

    screenPort = channel.port1;

    sim.postMessage ({ kind: "viewer", port: channel.port2 },
        [channel.port2]);

    render = new Worker (new URL ("render.worker.js", location.href).href);

    render.onmessage = (event) => fromRender (event.data);

    // Before the worker is opened rather than after, so that nothing can arrive
    // from it against a watch that still believes the dead thread's numbers.
    renderWatch.replace ();

    openRender (arena.layout, arena.resident);

    // Said once, on the console, and said as a warning rather than an alarm:
    // the run is still playing and a banner over it would be the page reporting
    // a failure the player cannot see and does not have. What a person does
    // want, if they ever read this, is the frame it happened on.
    console.warn ("player: the renderer stopped answering while it was drawing "
        + `frame ${renderWatch.shown}, so it was replaced. The simulation was `
        + "not interrupted. A second one ends the run.");
}

async function openAudio (layout, regions) {
    const worker = sim;
    const port = audioPort;

    audioPort = null;

    if (! port) { return; }

    if (synth) { await synth.ready; }

    // A run replaced while this waited: the thread on the far end has been
    // terminated, so there is nobody left to tell and nothing to close but this
    // end of a channel that can no longer carry anything.
    if (worker !== sim) { port.close (); return; }

    // No worklet, for any of the reasons `Synth.start` catches - and the
    // simulation is TOLD, rather than left posting into it.
    if (! synth || ! synth.node) {
        port.close ();

        worker.postMessage ({ kind: "audience", port: null });

        return;
    }

    synth.open (wasmBytes, trampolineBytes, layout, regions, port);
}

// Mark: the playtest hook from the design. Packages the frame index, the
// arguments the run was given and the input log so the run can be replayed to
// exactly this frame.
//
// Mark, Reset and Pause are all live in the DOM before a module is, because the
// page is built once and every game hangs off it. Each answers for the run
// there is not yet, rather than for a null session.
//
// TWO HALVES STILL, and the seam is the browser rather than the thread. What a
// recording is made of - the seed the run really used, the pairs it was told,
// the blob it was constructed from and the four logs - reaches this page as the
// run goes along and is held in `runRecord` below; `markText` in `player.js`
// composes the file out of it, because that is arithmetic over a format and
// needs no browser; and what is left here is the two calls that put text in a
// person's downloads.
//
// IT WAS A ROUND TRIP and is not, and the reason is the watchdog. Mark used to
// post a question and write what came back, which is correct for a page whose
// simulation is answering and useless for the one case a recording is most
// wanted in: a `step` that never returns answers no message, so the moment the
// page most needs the input log was the moment it could not ask for it. Holding
// the record removes the question, which also removes the token that paired an
// answer with it - a player leaning on `M` now writes one file per press with no
// reply to lose track of.

function mark () {
    if (! declaration || ! runRecord) { return; }

    writeMark (runRecord);
}

// The record as a file, downloaded. `frameIndex` is what the run reached, so a
// mark taken by a player names the frames that RAN - and the watchdog hands this
// a record whose count is one higher, because a recording that stops short of
// the frame that wedged reproduces everything except the hang.

function writeMark (record) {
    const blob = new Blob (
        [markText (declaration.name, declaration.version, record)],
        { type: "text/plain" });
    const a = document.createElement ("a");
    a.href = URL.createObjectURL (blob);
    a.download = declaration.name.toLowerCase () + "-mark-" + record.frameIndex
        + ".replay";
    a.click ();
    URL.revokeObjectURL (a.href);
}

// The run is over, so it is ended and said out loud.
//
// `docs/decisions.md` pending item 10, in the four things it asks for: the frame
// is named, the worker is terminated, the recording goes out in Mark's own
// format, and the report names the command that reproduces it natively.
// `Watchdog` in `player.js` decides WHEN, and everything here is what only a
// browser can do about it.
//
// TWO CALLERS AND TWO SENTENCES, which is why the reason and the frame count
// are passed in rather than composed here. A simulation that stopped answering
// is named by `stallLine` and reproduced one frame PAST what it reported
// finishing, because the frame it reported finishing is the one before the
// frame it stopped in. A renderer that stopped answering for the second time in
// a session is named by `renderStallLine` and reproduced AT the frame the
// picture was owed for, with no offset, because that description is what
// wedged and a recording that ran on past it would render the wrong one. The
// two numbers are different arithmetic over different threads, so each caller
// brings its own.
//
// The order matters in one place and one only: the thread is ended first,
// because everything after it takes time a page whose main thread is fine can
// afford and a spinning core is not. `terminate` on a thread spinning inside
// wasm is measured rather than assumed - it resolves in about 2 ms under node,
// and `products/web-player/tests/watchdog.js` asserts the exit rather than
// trusting it.
//
// The sound goes with it. `render_audio` runs in the worklet on states this
// thread no longer receives, so a processor left running would play its queue
// out and then 800 zeros a tick for ever; suspending is what a halt already does
// for a game that stopped for a better reason.
//
// AND THE PICTURE, for the same reason and with nothing to suspend: the renderer
// is a thread holding a canvas and an instance of a game that no longer runs, so
// it is ended rather than left. The last frame it drew stays on screen, which is
// what a person reading the banner over it should see - and where a renderer was
// replaced and then stopped again, the frame left standing is the FROZEN one
// `freeze` above put there, because the canvas under it belongs to a
// replacement that never drew. So `unfreeze` is deliberately not called here:
// dropping it would answer a run that ended with a black square.
//
// AND THE FILE MAY BE REFUSED, which is worth writing down rather than
// discovering. A browser may decline a download that no gesture asked for, and
// nothing here is a gesture - a frame callback noticed the silence. What makes
// that survivable is that the record is the page's: `M` still works after this,
// because there is no worker left to ask and there never needed to be one.

function seize (reason, frames) {
    sim.terminate ();
    sim = null;

    if (render) { render.terminate (); render = null; }

    stopLoop ();

    if (audioPort) { audioPort.close (); audioPort = null; }

    if (screenPort) { screenPort.close (); screenPort = null; }

    if (synth && synth.ctx) { synth.ctx.suspend (); }

    showAlarm (reason);

    console.error ("player: " + reason);

    // The frames the recording asks for, which its caller worked out: the
    // block above says why the two callers cannot share one number.
    //
    // The record is moved on rather than a copy of it written, so that pressing
    // `M` after this writes the same file the page just wrote. A player who
    // never saw the download - a browser may decline one no gesture asked for -
    // must not get a recording one frame short of the only frame that matters.
    if (runRecord) {
        runRecord.frameIndex = frames;

        writeMark (runRecord);
    }
}

function reset () {
    if (! wasmBytes) { return; }

    // What the outgoing run leaves behind, in the order the three have to
    // happen in.
    //
    // Its store first, because a reset is a new run rather than a lost one: the
    // game about to be built reads that store back in `construct`, so without
    // this a player who pressed R and then closed the tab would have the reset
    // run recorded and the run before it forgotten. Written out of the blob the
    // outgoing run's last stepped frame carried, which is what makes it possible
    // at all here: the thread that could render one is about to be terminated,
    // and a page that had to ask it for a blob first would be asking across a
    // round trip it does not have.
    //
    // Then the simulation's own thread, and every worker it is still holding -
    // one per body in the air - because a thread running a body for a game that
    // no longer exists is a core spent on an answer nothing will read, and its
    // message would reach a linear memory nothing is playing out of. `close`
    // asks for the bodies and `terminate` takes the thread: the first is the
    // session's own `runner.stop`, and the second is what makes a reset a new
    // linear memory on the far side as well as this one.
    //
    // And the renderer with it, in the same two moves and for a third reason
    // besides: it holds this run's canvas, and a canvas may be transferred once
    // per element - so a reset is a new element, a new handle and therefore a
    // new thread to hand it to, whatever else it is.
    writeSave ();

    if (sim) {
        sim.postMessage ({ kind: "close" });
        sim.terminate ();
        sim = null;
    }

    if (render) {
        render.postMessage ({ kind: "close" });
        render.terminate ();
        render = null;
    }

    // And this page's ends of the outgoing run's two channels, if the worklet
    // and the renderer never took them. The other ends went into a thread that
    // has just been terminated, so nothing will ever post to them again.
    if (audioPort) { audioPort.close (); audioPort = null; }

    if (screenPort) { screenPort.close (); screenPort = null; }

    // And what the outgoing run would have kept, which has just been written and
    // belongs to a game that no longer exists.
    keptSave = null;

    // And the things that belong to the outgoing run rather than to the page:
    // what it would have been recorded as, the two waits for answers it is no
    // longer owed, where its arena put things, and the last picture it drew if
    // its renderer had been replaced. A watchdog carried across a reset would
    // count the silence of a thread that has been terminated on purpose, and a
    // replacement already spent would be spent against the wrong run.
    runRecord = null;
    watchdog = new Watchdog ();
    renderWatch = new RenderWatch ();
    arena = null;

    unfreeze ();

    gameModule = new WebAssembly.Module (wasmBytes);

    declaration = new Consumer (gameModule, null);

    // The STORE is the one thing here that outlives the page, and it stays on
    // this side of the worker because it has to: `localStorage` does not exist
    // on a worker's thread. So the page reads it and hands the blob over with
    // everything else the run was told, and the page writes it back out of the
    // blob the simulation pushes with every frame that stepped - which is what
    // makes a save on `pagehide` possible with no round trip left to take.
    //
    // Null where this browser has storage turned off, which is a page that plays
    // and forgets rather than a page that refuses, and null for a game that
    // persists nothing - `Session` then hands `construct` the null
    // `interface/game.h` names for that case and for no other.
    const saved = saveStore && declaration.saveSize
        ? saveStore.read (declaration.name, declaration.saveSize)
        : null;

    // The worker's URL is the PLAYER's rather than the module's, exactly as the
    // decoder's is and for the same reason: one page plays every game, so a
    // file resolved against a game would have to be copied into every game's
    // directory to be found. Handed over rather than left out, because a
    // session without it runs bodies on this thread - correct, and the page
    // frozen for the length of a search, which is the whole thing tasks exist
    // to remove.
    // The resource directory goes with it, because a body reads its own files
    // now: the session posts the directory to a body's worker with the module,
    // and every fetch a run makes happens on that thread inside the read that
    // wanted it. A new session is a new set of workers and a new linear memory,
    // so nothing a previous run fetched is still reachable and nothing has to be
    // invalidated - the bytes are fetched again, which is one round trip and
    // never a stale pointer.
    //
    // The seed and the arguments are the one thing that does NOT come back new:
    // the same number and the same list every reset, decided once out of the
    // address above, so that the address bar describes what is on screen for
    // the whole life of the page and R is a reset rather than a reroll. The
    // MEMORY the pairs live in is new every time, because a new session is a
    // new linear memory - which is what keeps laying them down once per session
    // from leaking.
    //
    // AND THE THREAD IT ALL HAPPENS ON. `sim.worker.js` builds the `Session`
    // out of exactly what used to be passed here, one message along, and answers
    // with the addresses its arena laid down; nothing about what a session is
    // told has moved, only where it is told it.
    //
    // The module's bytes rather than the compiled module, and the two compiled
    // ones beside them because they already are: `fetchModule` answers bytes
    // and `fetchTrampoline` and `fetchCore` answer modules, and a
    // `WebAssembly.Module` clones to a dedicated worker because the two share an
    // agent cluster - measured in
    // `docs/archived/unified-tasks-phase0/probes.md` section 1. The page keeps
    // the bytes because `declaration` above compiles from them.
    sim = new Worker (new URL ("sim.worker.js", location.href).href);

    sim.onmessage = (event) => fromSim (event.data);

    // And the thread that draws, started here beside it and opened later: what
    // a renderer has to be told is where the simulation's arena put things, and
    // that is not known until the simulation answers. Started now all the same,
    // because starting a worker is a fetch and a compile and both are round
    // trips this run may as well spend while the session is being built.
    render = new Worker (new URL ("render.worker.js", location.href).href);

    render.onmessage = (event) => fromRender (event.data);

    // AND THE SCREEN, taken here and handed to that thread when it is opened.
    //
    // A fresh element every run, and always rather than only after the first:
    // `transferControlToOffscreen` may be called once per element and the handle
    // it answers with goes to one worker and dies with it, so the branch that
    // spared the markup's own canvas on the first run would exist only to be got
    // wrong later. `freshCanvas` carries the CSS box and the listeners across.
    //
    // Refused rather than played around, because a page that cannot hand the
    // canvas over cannot show the game at all and nothing else on it would say
    // so - the run would step, sound and record with a blank screen. Both
    // browsers the arcade is played in were measured to have it,
    // `docs/runs/drawing-worker-run.md` (c).
    freshCanvas ();

    if (! canvas.transferControlToOffscreen) {
        refuse ("this browser will not hand a canvas to a worker, and this "
            + "player draws every frame on a thread of its own. There is "
            + "nothing on this page that could paint instead.");
    }

    screenHandle = canvas.transferControlToOffscreen ();

    sim.postMessage ({
        kind: "open",
        bytes: wasmBytes,
        trampoline,
        core,
        seed: runSeed,
        args: runArguments,
        workerUrl: new URL ("task.worker.js", location.href).href,
        resources: { base: resourceDirectory.href },
        saved,

        // Which zero this page's timestamps stand on. A dedicated worker's
        // clock counts from its own creation, so `performance.now ()` there and
        // `event.timeStamp` here are the same unit and not the same zero - and
        // the queue the worker drains is stamped with the second. One number,
        // sent once, and the worker subtracts: it is exact where the estimate
        // the retired phase-locked clock kept was a model.
        pageTimeOrigin: performance.timeOrigin,

        // Whether the worker may start asking the display for frames at all.
        // A tab opened into the background is already hidden, and a run built
        // behind a pause is already paused - and the halt table below cannot
        // tell the worker so until it exists, so the first word it is given is
        // the state it is being born into.
        running: ! halted (halt),
    });

    // The channel the sound will take, made here and given away in two
    // directions: one end goes to the simulation now, and the other to the
    // worklet as soon as there is one. From then on a tick reaches the speaker
    // without this thread being involved at all, which is the property a page
    // relaying every frame would have thrown away.
    //
    // Before the first tick rather than after the worklet is ready, because a
    // port holds what is posted to it and carries its queue across the
    // transfer: the frames a run sounds while `addModule` resolves are heard.
    const channel = new MessageChannel ();

    audioPort = channel.port1;

    sim.postMessage ({ kind: "audience", port: channel.port2 },
        [channel.port2]);

    // And the channel the PICTURE will take, made the same way and for the same
    // reason: the simulation starts posting descriptions into it at once, and
    // the renderer takes the queue with the port when `openRender` hands it
    // over. Two channels rather than one, because the two consumers are told
    // different things at different cadences and a shared port would make each
    // of them read past the other's messages.
    const screenChannel = new MessageChannel ();

    screenPort = screenChannel.port1;

    sim.postMessage ({ kind: "viewer", port: screenChannel.port2 },
        [screenChannel.port2]);

    describe ();

    // A new run has everything to do, whatever the old one had run out of.
    // `paused` and `hidden` are deliberately left alone - resetting is not
    // unpausing, and a reset behind a menu is still behind it - but a game that
    // no longer exists cannot be the reason the loop is stopped.
    wake ();
}

// Everything the simulation says, which is three things: the arena it laid down,
// a tick's worth of work, and a task that has become ready. A recording used to
// be a fourth and is not, because the page holds one rather than asking for it -
// `mark` above says why, and the answer is a thread that cannot answer.
//
// A message from a worker this page has replaced never arrives, and that is
// `reset`'s doing rather than a check here: the outgoing thread is terminated
// before the new one is built, so there is no answer in flight to attribute to
// the wrong run. It is the same sentence `Session.onStaged` carries one thread
// over, kept by the same move - ending the thread rather than filtering what it
// says.

function fromSim (message) {
    switch (message.kind) {

    case "opened":
        // What a recording says before its first record, and the only part of
        // one that cannot change: the seed the run really used, the blob it was
        // constructed from and the pairs it was told. It is also what says a run
        // has opened at all, which is what the frame case below reads.
        runRecord = openRecord (message);

        // And what this run would keep before it has stepped at all, which is
        // the one blob no game asks for: `construct` may have rewritten a field
        // on the way in, and a tab closed before the first request has to write
        // those bytes rather than the ones the store already held. Kept exactly
        // as a frame's is, through the same slot, so nothing below this can tell
        // which message a blob arrived on.
        if (message.save) { keptSave = message.save; }

        // The addresses the simulation laid down and the regions it laid down
        // once, to BOTH consumers: each is an instance of the same module
        // rendering the same bytes, one thread over, and each needs both
        // because a renderer may follow a pointer into the argument storage,
        // the save blob or a task's output, which is
        // `interface/game.h:34-44`'s list.
        //
        // The renderer first, because it is the one with a person waiting on
        // it: the sound waits on `addModule` either way, and a frame drawn
        // sooner is the whole of what the argument about this player's latency
        // has ever been about.
        //
        // KEPT AS WELL AS SPENT, because a renderer this page has to REPLACE
        // is told exactly what this one is being told and the thread that
        // knows it must not be interrupted to ask. `arena` above prices what
        // holding it costs.
        arena = { layout: message.layout, resident: message.resident };

        openRender (message.layout, message.resident);
        openAudio (message.layout, message.resident);

        break;

    case "frame": {
        if (! runRecord) { break; }

        // The simulation is alive and this is where it has got to. First,
        // because what this clears is a wait: a frame message arrives once per
        // display frame whatever else it carries, and a frame that owed no step
        // sends one for exactly this reason.
        watchdog.answered (message.frame);

        // And whether this tick published a PICTURE, which is `present`'s own
        // two skips read off the message it already sends: a tick that stepped
        // and did not claim `game_report_still`. It is the other half of what
        // the render watchdog needs - a renderer owes a draw for exactly the
        // frames the simulation published one for, and for a resting game, a
        // still frame or a halted page that is none of them.
        if (message.stepped && ! message.held) {
            renderWatch.published (message.frame);
        }

        // And what the run would be recorded as, one frame longer. The entries
        // are the ones the simulation's logs grew by, so this is a push of
        // nothing on almost every frame.
        growRecord (runRecord, message.frame, message.records);

        // And what it would keep, as of the newest frame the game asked to be
        // saved on. Held rather than written, because `watchStore` decides when
        // a host saves and this is not one of its moments; and a frame carrying
        // none leaves the last one standing, which is what makes this a mailbox
        // rather than a log.
        if (message.save) { keptSave = message.save; }

        // The frame a pause costs has been published, so the sound may now stop.
        // `setHalt` held it back for exactly this: the audio context is
        // suspended after the last frame it is owed rather than before it.
        //
        // OWED rather than heard, and that was already the case before the
        // worklet rendered: the queue on the far side is up to three ticks deep,
        // so what a suspend cuts off is whatever of them had not reached the
        // speaker. What changed is only which side the arithmetic happens on.
        if (message.pointerAway && quietWhenPublished) {
            quietWhenPublished = false;

            // The state is read again rather than trusted, exactly as
            // `AUDIO_GRACE`'s timer reads it: a player who paused and resumed
            // faster than a message round trip is a page that has already been
            // told to start the sound, and stopping it here would silence a run
            // that is playing.
            if (synth && halted (halt)) {
                cancelAudioRest ();
                synth.ctx.suspend ();
            }
        }

        // The game says nothing more is coming until something happens to it,
        // and nothing has - `Clock.advance` on the far side holds the two things
        // that can already have happened by the time this is read. What is left
        // here is the flag, which is the page's because everything it stops is.
        if (message.idle) { setHalt ({ idle: true }); }

        break;
    }

    // A task became ready under a game whose state had no other reason to move.
    case "wake":
        wake ();

        break;
    }
}

// The one place the game's declared colour becomes the page's. `theme` is in
// `player.js` and does the whole derivation; what is left here is the browser's
// half of it - writing custom properties, which is the page's own vocabulary,
// and `color-scheme`, which is what makes the browser's scrollbars and its
// focus rings follow a game that chose a pale surround.
//
// Custom properties on `documentElement` rather than a stylesheet swap, so the
// fallback block at the top of this file stays the one writer of what these
// mean and this is only new values for them. It is also what a refusal falls
// back to: `refuse` throws before a session exists, so the page keeps its own
// dark chrome and says so in `--alarm` rather than on whatever the game wanted.

function applyTheme () {
    const colours = theme (declaration.palette, declaration.background);
    const root = document.documentElement;

    for (const [name, value] of Object.entries (colours)) {
        if (name === "light") { continue; }

        root.style.setProperty (`--${name}`, value);
    }

    root.style.colorScheme = colours.light ? "light" : "dark";
}

// What the page does with the identity it read out of the module, which is now
// almost nothing: a title, the colours, the cursor and the keycap legends.
//
// The legends are the one of the four that is advice rather than appearance,
// and they are here because they are read out of the module exactly as the
// other three are - `Game_Controls` arrives through the same hand-mirrored
// `LAYOUT` block as the name and the palette do.
//
// This used to restate the whole of it on screen - name, version, state size,
// controls, what it had loaded, palette entries drawn - and the argument for
// that was that every one of those values arrives through the hand-mirrored
// `LAYOUT` block, so a mirror that had drifted from `interface/game.h` showed
// up as a wrong name or an impossible state size in front of a reader, rather
// than as a game quietly misbehaving.
//
// That reader is now `web_player_plays_<game>`, which compares all five against
// what `inspector info` reads out of the native plug-in through the console - a
// wholly separate path, checked on every run rather than whenever somebody
// happens to look. The row was the only reader when it was written and is not
// the only reader now, which is what made it affordable to delete.

function describe () {
    // What is left of the identity the page read out of the module, now that
    // the row that showed the rest is gone: the tab still carries the name and
    // the version, which is the one place a person can tell two games apart
    // without playing them.
    document.title =
        `${declaration.name} ${declaration.version.join (".")}`;

    applyTheme ();
    applyCursor ();

    fillLegends (legendRow, declaration.controls, document);
}

// A cursor the browser draws is on screen and NOT in the framebuffer, so it is
// outside the golden, outside `inspector shot` and outside every mechanism this
// tree has for knowing what was drawn. A game that reads the pointer draws its
// own, and this is where the browser's stops competing with it.
//
// It comes back while paused, because the player has stopped aiming at the game

//

    // fullscreen request ran first, took the activation, and `resume()` was

    // before a bubbling one on `window` for an event targeting anything below

    //

    // was silent until the canvas happened to be clicked. `resume` already

    runLoop ();

    // The frame `construct` left behind, drawn without waiting for a step. The
    // simulation has held a state since it answered `opened` and its own frame

    // title screen up rather than an empty canvas - and it is a message, so a
    // worker still compiling simply has not reached it yet.
    redraw ();

    // `visibilitychange` fires on a change rather than on the state - so

// modules is not the browser's doing: each refuses by name on every path that
// does not end in the module it wanted, and this hands what they return to the
// boot above.
//
// Together rather than in sequence, because none of them waits on another and a
// page holding two of the three can do nothing with what it has: a game imports
// nothing, so without this player's own six functions there is no record to
// hand a `step`, and without the rulebook there is no table to spawn into, no
// id to ask about and nothing to hold a run's arguments to.

Promise.all ([
    fetchModule (moduleBase),
    fetchTrampoline (new URL ("trampoline.wasm", location.href)),
    fetchCore (new URL ("host-core.wasm", location.href)),
]).then (start);
</script>
</body>
</html>
