function togglePause () { setHalt ({ paused: ! halt.paused }); }

// The page stops being in front, and the game stops with it - then starts again
// when it comes back, which is the half that took a second attempt.
//
// Reported as a bug and worth stating as one: navigating back from a game left
// it running and audible behind the menu. The page had no handler for any of
// this, so whether a navigation stopped the loop was whatever the browser
// decided on its own - and a page holding an `AudioContext` is exactly the kind
// a browser may keep alive to return to rather than unload.
//
// The first fix pointed these at the pause, and that was wrong in a way worth
// keeping written down: it stopped the game, and then made the player press
// `Enter` to get a run back that they had never paused. Requiring a keypress to
// undo something the player never did is the same defect as not stopping at

// visibility in both directions.
//

// `visibilitychange` is everything else that puts the page behind something -

addEventListener ("pageshow", () => setHalt ({ hidden: document.hidden }));

addEventListener ("visibilitychange",
    () => setHalt ({ hidden: document.hidden }));

// The same two signals again, for the other thing that has to happen when a
// page stops being looked at - and a timer under them, because neither of the
// two covers every way a page goes away. `watchStore` in `player.js` carries
// what was measured about which of them fires when.
//
// Registered through `watchStore` in `player.js` rather than written out beside
// the three above, because what it decides is not the browser's: which moments
// a host saves at, that the session it saves is the one playing NOW rather than
// the one this line closed over, and that a write lands between frames. The two
// halves that ARE the browser's are the objects handed in - `pagehide` is

// A blur is not a keyup, and that is a third instance of the sentence the two

// the `keyup` is delivered to whatever took the focus and this page waits for
// it for the rest of the run. Nothing here can distinguish that from a key
// genuinely still down, so the held state is dropped and a player who really
// was holding one presses it again - which costs a frame and is recoverable,
// where a button stuck down is neither.
//

    input.clearEdges ();

pauseButton.addEventListener ("click", togglePause);

document.getElementById ("hide").addEventListener ("click", toggleChrome);

let accumulator = 0, last = 0, simTime = 0;

// The animation frame the loop is waiting on, or null when it is waiting on
// none.
//
// Nothing tracked this before, because the chain was unbroken: `loop` re-armed
// itself on its first line and a halt was a branch inside it that returned
// early. That is what `game_report_idle` cannot afford. A game that has run out
// of things to do with the page still in front of the player would go on being
// handed a callback sixty times a second for as long as it rested, and the
// wakeup itself is the cost this flag exists to remove - `docs/decisions.md`
// measures a game's own arithmetic at about 0.4% of a core and names the
// wakeup, the compositor behind it and the audio thread as what actually drains

// is one rule rather than two: the loop is armed when nothing halts it.

let frameRequest = null;

// Armed at the TOP of `loop` rather than at the foot of it, which is where the
// call has always been and is worth keeping: a step that throws - a game

// frame, where a re-arm below the throw would take the page's loop down with

function stopLoop () {
    if (frameRequest === null) { return; }

    frameRequest = null;

function loop (now) {
    frameRequest = null;
    runLoop ();

    // Unreachable, and here for what it prevents rather than for what it does:

    // flag is what starts it again.
    if (halted (halt)) { return; }

    if (! last) { last = now; simTime = now; return; }

    let delta = (now - last) / 1000;
    last = now;

    if (delta > 0.25) delta = 0.25;         // never spiral after a tab switch
    accumulator += delta;

    // advances in whole frames and is never reset to `now`, so it stays behind
    // the wall clock by at most the accumulator's remainder.

    // `held` is every step so far having reported `game_report_still`, which is

    // painted, and a run of still frames is what connects it to the state now.

    // steps after it claim, because the frame finally drawn is the last state
    // rather than the last claim.

    let stepped = 0, held = true, rested = false;

        // the loop rather than after it: a catch-up of eight steps owes the
        // audio thread eight frames of sound, and taking only the last would
        // drop seven - the same mistake the input queue exists to avoid. A

        // that costs no `render_audio` call and no buffer.

    // keep up. Drop the backlog rather than carry it: left to accumulate,
    // simulated time falls permanently behind the wall clock, and every queued
    // key then has to wait out that lag before a step will take it. Dropping
    // costs some skipped frames, which is what a machine this far behind was
    // going to show anyway.
    //
    // Not when the break above was a game resting: the owed time is forgiven on
    // the way back out of rest instead, and applying input up to now here would
    // latch an edge into a queue that is about to have nothing draining it.

    if (! rested && accumulator >= 1 / FRAME_RATE) {
        accumulator = 0;
        simTime = now;
        input.applyUpTo (simTime);
    }

    if (stepped) { draw (held); }

    // The game says nothing more is coming until something happens to it, and
    // nothing has.
    //
    // Two things can already have happened by the time this is read, and both
    // are the same shape: something arrived that the step which made the claim
    // could not have seen. An input event queued behind that step's boundary is
    // one - `waiting` is what asks. A task's answer, staged on its own message
    // between animation frames rather than on this frame's work, is the other.
    // Both are shown or drained by a step, so sleeping through either would
    // strand it with nothing running.
    if (rested && ! input.waiting () && ! session.stagedTasks ().length) {
        setHalt ({ idle: true });
    }
}

// ---------------------------------------------------------------------------
// Boot, once the module's bytes are in hand.
//
// No overlay: the title screen is the game's own, drawn by its `render` and
// left by its own `a` button, so the console shows it rather than the page.
//
// The page keeps exactly one audio responsibility. An AudioContext created
// without a user gesture starts suspended and stays there - measured, on
// file:// and http:// alike - so the first gesture of any kind resumes it. That
// is usually the same keypress that leaves the title screen, so a player never
// notices there was a rule. Arriving from a menu by clicking a link, the
// context is already running, because activation propagates across a navigation
// a gesture initiated - also measured - and then nothing here has to happen at
// all.
//
// The keypress is NOT consumed: it belongs to the game, which is watching for
// exactly that edge.
// ---------------------------------------------------------------------------

function start ([bytes, host, rules]) {
    wasmBytes = bytes;
    trampoline = host;
    core = rules;

    // Before the first session and after the one round trip it needed: what a
    // pair is held to is the rulebook's, so this is the earliest the page can
    // ask. A refusal here still refuses the page once rather than on whichever
    // reset happened to be the first to want it.
    //
    // Out of `runQuery` rather than out of `location.search`, which is the
    // ordering the composer above exists for: the seed this reads is the one
    // the address bar is showing, and the `day` beside it is the one that was
    // composed at load rather than one re-read now - a page that re-read the
    // clock here would play one day and record another the moment a run crossed
    // midnight.
    ({ seed: runSeed, args: runArguments } = queryArguments (runQuery,
        new HostCore (core)));

    reset ();

    // Said once, at startup, because nothing on screen says where the page went
    // looking. A module moved out of its own directory, or a `resources=` that
    // names a directory nobody built, leaves every load failing, and the game
    // draws its fallbacks with the reason only in here. It prints the resolved
    // directory rather than what was typed, so a relative value and the site
    // prefix it was resolved against are both visible.
    //
    // WHERE rather than WHAT, which is the whole of what this line lost with
    // the manifest: nothing is declared in advance any more, so at startup no
    // host knows what this game will ask for. What each read did is on the
    // console as it happens, and `resourceLine` is the whole log.
    console.info (`player: ${session.name} reads what its bodies ask for from `
        + resourceDirectory.href);

    // Built at load, not on the gesture. Compiling the module, loading the
    // worklet and constructing the processor all work on a suspended context -
    // measured, the processor runs and answers on the audio thread with no
    // gesture whatsoever - and only `resume()` is gated. Building it here costs
    // nothing and removes an eight frame window, measured, in which the loop
    // was already running and anything the game emitted was dropped for want of
    // a node.
    synth = new Synth ();

    const unlock = () => synth.resume ();

    // Two properties, and the fullscreen key cost a bug for want of each.
    //
    // CAPTURE, so the unlock sees the gesture before any handler that might
    // SPEND it. `requestFullscreen` consumes transient user activation, and the
    // page's own keydown listener is installed at load while this one cannot
    // exist until the module has been fetched - so on a first press of `F` the
    // fullscreen request ran first, took the activation, and `resume()` was
    // refused the one thing it needs. A capture listener on `window` runs
    // before a bubbling one on `window` for an event targeting anything below
    // it, which a keydown always is.
    //
    // And PERSISTENT rather than `{ once: true }`, which is the deeper of the
    // two. A one-shot spends itself whether or not the resume took, so a single
    // refused attempt left the keyboard with no unlock at all and only the
    // still-armed pointerdown could recover it - press `F`, play, and the game
    // was silent until the canvas happened to be clicked. `resume` already
    // no-ops on a running context, so leaving these installed costs a state
    // check per gesture and makes the unlock retry until it takes. That is
    // robust to any FUTURE handler that spends activation, which the capture
    // flag alone would not be.
    //
    // `start` runs once, at `fetchModule (…).then (start)`, so these are
    // registered once and nothing accumulates them.

    addEventListener ("keydown", unlock, { capture: true });
    addEventListener ("pointerdown", unlock, { capture: true });

    // The identity line is longer than the placeholder, so the HUD may have
    // grown a row and the canvas has to be measured against what is there now.
    fitCanvas ();

    runLoop ();

    present ();

    // A page opened into a background tab is already hidden, and
    // `visibilitychange` fires on a change rather than on the state - so
    // without this the one case that never gets the event is the one that was
    // never in front to begin with. It needs no counterpart: the event does
    // fire when such a tab is first looked at.
    if (document.hidden) { setHalt ({ hidden: true }); }
}

// All three fetches are `player.js`'s, because a round trip for any of these
// modules is not the browser's doing: each refuses by name on every path that
// does not end in the module it wanted, and this hands what they return to the
// boot above.
//
// Together rather than in sequence, because none of them waits on another and a
// page holding two of the three can do nothing with what it has: a game imports
// nothing, so without this player's own five functions there is no record to
// hand a `step`, and without the rulebook there is no table to spawn into, no
// id to ask about and nothing to hold a run's arguments to.

Promise.all ([
    fetchModule (moduleBase),
    fetchTrampoline (new URL ("trampoline.wasm", location.href)),
    fetchCore (new URL ("host-core.wasm", location.href)),
]).then (start);
</script>
</body>
</html>
