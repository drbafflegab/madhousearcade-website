<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>player</title>
<style>
  /* Every colour on this page is one of these, and the page rewrites them from
     the game's own palette once the module is read - see `applyTheme` below.
     The values here are the fallback and nothing more: they are what a reader
     sees before a module has been loaded, and what stays on screen when the
     load is refused. They are the dark chrome this page had before a game could
     choose, so a refusal still looks like the player rather than like nothing.

     Named for their role rather than their colour, because after the first
     frame they are whatever the game said. */
  :root {
      color-scheme: dark;
      --surround: #0b0b12;
      --ink: #c8c8d4;
      --dim: #6a6a80;
      --panel: #1a1a24;
      --hover: #23232e;
      --edge: #2e2e3c;
      --alarm: #e06c6c;
  }
  * { box-sizing: border-box; }
  /* `safe` is what makes zooming IN work. Centred flex content that outgrows
     its container overflows equally in both directions, so the top and left of
     an oversized canvas end up off-screen with no scroll that reaches them -
     and zooming in past the window is now an ordinary thing to do, because a
     zoom no longer refits. `safe` centres while there is room and aligns to the
     start once there is not. The plain `center` above it is the fallback: a
     browser that does not know the keyword drops the whole declaration, so it
     has to be given one it does know first. */
  /* `overscroll-behavior` stops the rubber band, which on a touch device reads
     as the whole page sliding a centimetre under a gesture meant for the game.
     It stops the BOUNCE rather than scrolling itself, which matters: zooming in
     can legitimately make the canvas taller than the window, and the page has
     to stay scrollable to reach it. `overflow: hidden` would have fixed the
     bounce and taken that with it. */
  html, body { overscroll-behavior: none; }
  /* `dvh` is why this page used to scroll a little on a phone with nothing to
     scroll to. On iOS `vh` is the LARGE viewport - the one measured with the
     browser's toolbars collapsed - so a body sized in it stands taller than the
     window by the toolbar's height for as long as the toolbar is showing, and
     the page offers exactly that much slack. `dvh` follows the viewport that is
     actually there.

     The `vh` line stays underneath it for anything that does not know the unit,
     which then gets the old behaviour rather than no height at all. */

  /* NO PADDING, which is a measurement rather than a taste. The canvas is a
     whole multiple of 240 device pixels, so every pixel the page keeps for
     itself is spent in steps of a whole scale - and a 20px surround is exactly
     what stood between several real devices and a step larger game. Their own
     viewports, run through `canvasScale`: an iPhone SE drew at 2 with the
     padding and draws at 3 without, a 15 Pro Max at 4 and now 5, an iPad mini
     at 5 and now 6, each of them decided by the width rather than the height,
     so a toolbar cannot change the reading. Where it buys no step it costs
     nothing either: the leftover of a whole multiple is centred slack, and the
     total space around the game is the same however it is divided.

     The page measures this rather than knowing it - `available` below reads
     the computed padding, so this line is the only place the number lives, and
     a surround put back here is one the fit will see.

     The chrome keeps a margin of its own, on the row instead of on the page:
     `#hud` carries the horizontal padding now, so a legend on a narrow phone
     still stands off the edge while the canvas above it no longer has to. */
  body {
      margin: 0;
      min-height: 100vh; min-height: 100dvh;
      background: var(--surround); color: var(--ink);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      display: flex; flex-direction: column; gap: 14px; padding: 0;
      align-items: center; justify-content: center;
      align-items: safe center; justify-content: safe center;
  }
  /* `touch-action: none` is not decoration: without it the first drag across
     the canvas scrolls the page instead of playing the game, and on a phone
     that is every gesture a pointer game is made of. It is not the whole of
     that story either: iOS zooms the page on a double tap over the screen in
     spite of this declaration, and the script below refuses that gesture where
     the declaration is ignored.

     No border and no radius, and what that gives up is worth stating. The
     page's background is the game's own `background` entry, so on a game
     pointing it at the colour it fills its screen with - four of the six here -
     there is now nothing at all saying where the console ends, and the screen
     runs into the page. For those that is the effect rather than the cost:
     `games/asteroids` has space on both sides of that line. A game wanting the
     console to read as an object declares a surround its screen does not use,
     which is what `games/pong` and `games/suika` do. */
  #screen {
      image-rendering: pixelated; background: #000;
      display: block; touch-action: none;

      /* iOS answers a long press on an element it thinks is content by
         selecting it and raising the copy callout. That is a nuisance on any
         game and an outright conflict on one whose OWN long press is a move:
         `games/minesweeper` marks a mine by holding half a second on a cell, so
         the browser's gesture and the game's fire on the same finger. The
         callout wins, and the mark never happens.

         Three properties rather than one, because they are three behaviours:
         the callout is the menu, `user-select` is the blue selection under it,
         and the tap highlight is the grey flash iOS paints on anything it
         thinks was tapped. None of them can mean anything over a framebuffer.

         Scoped to the canvas rather than the page, so the text in the row below
         can still be selected and copied. */
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
  }
  #hud { display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
         justify-content: center; min-height: 20px; padding: 0 12px; }
  /* Said again here because the rule above would otherwise silently beat it: an
     author `display: flex` outranks the UA stylesheet's `[hidden] { display:
     none }` whatever the specificity, so without this line the attribute the
     page sets on the row does nothing at all. */
  #hud[hidden] { display: none; }
  /* The legends are written by the script rather than by this file, so they
     need a container to be written into - and a container would be one flex
     item holding two legends where the row wants two items with the row's own
     gap between them. `display: contents` drops the box and leaves the children
     to the row, which is what makes a derived legend sit exactly where a
     literal one used to. */
  #legends { display: contents; }
  kbd { background: var(--panel); border: 1px solid var(--edge);
        border-radius: 3px; padding: 1px 5px; color: var(--dim); }
  button { background: var(--panel); color: var(--ink);
           border: 1px solid var(--edge);
           border-radius: 3px; padding: 4px 10px; cursor: pointer;
           font: inherit; }
  button:hover { background: var(--hover); border-color: var(--edge); }
  .dim { color: var(--dim); }
</style>
</head>
<body>

<canvas id="screen" width="240" height="240"></canvas>

<!-- The only thing under the canvas, and it starts hidden - in the markup
     rather than from the script, so the page never paints it and then takes it
     away. `I` toggles it; `showChrome` below says what that costs the canvas
     and why a refusal overrides it.

     Controls and legends, and nothing read out of the running game EXCEPT what
     it says it reads: every reading this page used to carry is gone, the last
     of them a steps-per-second gauge that the accumulator pinned at 60 whenever
     the machine was keeping up. The legends are `kbd` rather than buttons
     because they name the CONSOLE's buttons, which the page cannot press;
     everything after them is the page's own and each carries its key in its
     label, so there is one place to learn a shortcut rather than a legend
     beside a control that already said it.

     `legends` is empty here and filled by `fillLegends` from the module's own
     `Game_Controls`, so a game is advertised the input it actually reads and
     nothing else. Empty rather than seeded with the pad's two: the page does
     not know what the game reads until it has read the module, and a legend
     painted and then taken away is worse than one that arrives with the game.
     A refusal never fills it, and that is right - a page that will not play has
     no controls to name. -->

<div id="hud" hidden>
  <span id="legends"></span>
  <button id="pause">Pause (Enter)</button>
  <button id="hide">Hide Information (I)</button>
  <button id="mark">Mark frame (M)</button>
  <button id="reset">Reset (R)</button>
  <button id="full">Fullscreen (F)</button>
</div>

<!-- The player's browser-free half, and everything below this line is the
     browser's: the canvas, the audio context, the animation frame and the
     keyboard the page takes them from. Loaded as a classic script so that its
     declarations are in scope for the inline one that follows.

     `products/web-player/source/player.js` says why the split is where it is
     and what runs the far side of it without a browser. -->

<script src="player.js"></script>

<script>
"use strict";

// Where a refusal is SHOWN is the page's, so the page installs it; the console
// line and the throw are `player.js`'s, because neither is the browser's.
//
// The HUD is looked up on each refusal rather than captured here, because a
// refusal can happen while the module is being read, which is before the const
// below exists.

onRefusal (reason => {
    const banner = document.getElementById ("hud");

    if (! banner) { return; }

    // Revealed, because the HUD starts hidden and a banner nobody can see is
    // the same as no banner: a page that refused would otherwise be a blank
    // canvas and nothing else. The attribute is set here rather than through
    // `showChrome`, for the same reason the element is looked up here rather
    // than captured above - a refusal can arrive while the module is being
    // read, which is before `canvas` and `scaleLabel` exist, and `showChrome`
    // reaches both through `fitCanvas`. That would replace the message with a
    // ReferenceError from inside the handler meant to deliver it.
    banner.hidden = false;

    banner.textContent = "player: " + reason;
    banner.style.color = "var(--alarm)";
});

// ---------------------------------------------------------------------------
// Which game this is.
//
// `player.html?module=<url>`, and `&resources=<directory>` beside it when the
// bytes are not the ones built beside that module. The player knows nothing
// about where games live: it plays whatever module URL it is handed, exactly as
// `inspector` opens whatever module path it is given, so one published page
// plays every game in the tree and every game outside it.
//
// The module URL is resolved against the PAGE, and everything the module needs
// is then resolved against the MODULE - see `resourceBase` in `player.js`.
// Those are two different directories whenever the page is not sitting beside
// the game, which is the normal case now that there is one page rather than a
// copy per game.
//
// `resources=` is the exception and is resolved against the PAGE too, because
// it is the caller's answer rather than the module's: `resourceBase` in
// `player.js` holds that rule, the site-relative resolution it needs to survive
// being served from a subdirectory, and the five values it refuses.
//
// `module` and `resources` are the whole of what this page KEEPS. EVERY OTHER
// KEY IS THE GAME'S and is passed through as a `Game_Arg` pair: nothing on a
// module says a word about arguments in advance, so there is no declaration to
// match a key against and a key this game has never heard of is not an error -
// it is a key for a harness, for a menu, or for the next version of the game,
// and the run starts regardless. That is why the two above are listed rather
// than left to be inferred from what happens to be read here.
//
// `seed` is this host's own term and is NOT one of them: it rides the query as
// an ordinary pair and the rulebook takes it back out below, so one grammar
// carries it from an address bar and a command line alike.
// ---------------------------------------------------------------------------

const query = new URLSearchParams (location.search);

const moduleUrl = query.get ("module");

if (! moduleUrl) {
    refuse ("no module. Open this page as player.html?module=<url>, where "
        + "<url> names a game's <name>.wasm, relative to this page or "
        + "absolute. Add &resources=<directory> to play it against bytes "
        + "that are not the ones beside it.");
}

// Resolved once, here, so that a URL this page cannot make sense of is a
// refusal naming it rather than a TypeError from whichever line reached for it
// first.
const moduleBase = resolve (moduleUrl);

function resolve (url) {
    try {
        return new URL (url, location.href);
    } catch {
        refuse (`module=${url} is not a URL this page can resolve against `
            + `${location.href}.`);
    }
}

// Resolved here rather than at every `reset`, for the reason above and one
// more: a bad value should refuse the page once, before a module is fetched,
// rather than on whichever reset happened to be the first to want a file.
const resourceDirectory = resourceBase (moduleBase, location.href,
    query.get ("resources"));

// ---------------------------------------------------------------------------
// Which run this is, and the address that says so.
//
// Decided once, here, rather than at every `reset`. A roll per reset would make
// R a different game each time, which is not what resetting a game means, and
// would leave the address bar describing only the first run the page played.
//
// `composeRun` is handed all three of the things this page can reach that
// `player.js` may not - `Math.random`, the clock, and the browser's own
// `history` - and it composes what the query did not carry: a seed where none
// was named, a day where none was named, MERGED into what was there and written
// back through `replaceState`, which rewrites the address with no navigation
// and no history entry. It is a relative reference, so nothing here needs to
// know where the site is mounted. A bare link is therefore a fresh game, and
// the moment it loads the address bar holds the run that is on screen.
//
// THE RUN IS READ OUT OF THE QUERY THAT COMPOSER ANSWERED, which is the one
// ordering decision here and is what keeps a page from playing one run while
// displaying another. So `runQuery` rather than `location.search` is what
// `start` below reads the seed and the pairs out of - and a recording written
// later carries the number that was rolled by construction rather than by a
// rule somebody has to remember.
// ---------------------------------------------------------------------------

const runQuery = composeRun (location.search, Math.random, new Date (),
    history);

// ---------------------------------------------------------------------------
// What this browser remembers about this game.
//
// `localStorage`, keyed by the module's own declared name - `SaveStore` in
// `player.js` holds the key, the one spelling a blob has and the ladder that
// discards every defect to zeros. What is here is only the browser's half of
// it, because reaching for `localStorage` at all is what a browser can refuse.
//
// It THROWS rather than answering nothing where storage is disabled, or where
// a page is embedded under a policy that partitions it - so the property access
// is inside the guard rather than beside it, and a page that cannot have a
// store plays and forgets instead of refusing to start. That is the same
// judgement the discard ladder is written around: nobody would be told, and a
// lost score is smaller than a blank canvas.
// ---------------------------------------------------------------------------

const saveStore = (() => {
    try { return new SaveStore (localStorage); }
    catch { return null; }
}) ();

// The seed and the rest of what this run was told, decided in `start` rather
// than here.
//
// `runSeed` is a number by the time anything reads it: `queryArguments` answers
// `null` for a query that named no seed, and `runQuery` above cannot be one -
// the composer wrote a number into it wherever the address had none.
//
// Every key that is not one of this page's own becomes a pair, held to the
// format a recording and a session need and to nothing else - and nothing about
// that waits for the GAME, because there is nothing on a module to wait for. It
// waits for the RULEBOOK: the charset, the two lengths, the reserved key, the
// duplicate and the sort are `products/host-core`'s, and this page fetches that
// module beside the trampoline. So the split is by which round trip rather than
// by which question, and the seed and the pairs a run was told are still
// decided once, out of the query the composer above answered, for the whole
// life of the page.
let runSeed = 0;
let runArguments = null;

// ---------------------------------------------------------------------------
// Audio. The game renders its own samples; this only plays them.
//
// There is no synthesiser here and no second implementation to keep in step
// with the CLI - `render_audio` produced these samples inside the game's own
// wasm module, so the page and `inspector wav` are playing arithmetic that ran
// in the same code. A ctest renders every golden replay through both targets
// and compares the samples.
//
// Two measured constraints shape this (see docs/decisions.md):
//
// - `addModule` from a blob URL FAILS on file:// with AbortError, while a data:
//   URI works on both file:// and http://. The page is served now, so the blob
//   route would work here - the data: one is kept because it is the one that
//   works everywhere, and swapping it would buy nothing.
// - An AudioContext created without a user gesture starts suspended and stays
//   there, so the first gesture of any kind resumes it.
// ---------------------------------------------------------------------------

// The processor's source, as text: it runs in its own global scope with no
// access to anything here.
const SAMPLE_PLAYER = `
// How many frames of sound may be waiting to be played, which IS the latency:
// each is 800 samples, so a depth of three is 50 ms between a frame being
// rendered and being heard, plus whatever of a fourth the reader is already
// inside. The trim below runs on every message, so this is a TARGET rather
// than a disaster ceiling - a burst is cut straight back to it - and it is
// also the cushion the queue exists to be, because a producer and a consumer
// both running at 60 Hz hold whatever depth they were left at rather than
// returning to one.
//
// Three is a judgement rather than a measurement, and both sides are worth
// naming because nothing here can settle it. One is too few: a queue one frame
// deep is empty for part of every ordinary interval, and process below plays
// an empty queue as zeros, which is a click. Two survives a single dropped
// animation frame exactly and with no margin at all - two frames of sound,
// 33 ms, against the 33 ms gap - and one dropped frame is the commonest hiccup
// there is on a page that is also compositing a canvas. Eight, which is what
// this was, is far too many: 133 ms that nothing ever gives back, so every
// sound arrives eight frames behind the picture that made it and stays there
// until the page is reloaded. Three absorbs a dropped frame with a whole frame
// to spare, for 50 ms.
//
// It is also the whole answer to a queue holding sound that is out of date,
// which is why there is no way to empty one here. There was a drain - a
// message that set the queue length to zero - and nothing in this tree ever
// posted one, so it has gone. Given a caller it would have been wrong rather
// than merely idle: the depth is the cushion as well as the latency, and two
// clocks at the same rate never rebuild a cushion they are robbed of, so
// emptying the queue on a reset or a resume would buy back 50 ms of sound
// nobody can place and pay a click for every hiccup for the rest of the run.
//
// There is no browser in ctest, so neither side of the judgement is measured.
// What would settle it is a real output device, an animation frame
// deliberately blown, and somebody listening for the click.
const QUEUE_DEPTH = 3;

class SamplePlayer extends AudioWorkletProcessor {
    constructor () {
        super ();

        // Frames arrive from the main thread on requestAnimationFrame's clock
        // and are consumed on the audio clock. A queue absorbs the difference.
        this.queue = [];
        this.pending = null;
        this.pendingAt = 0;

        // One frame of zeros, for every frame a game reports as silent. The
        // length is the page's own constant, interpolated in with the rest of
        // this source, so a silent frame is exactly as long as a rendered one.
        //
        // It lives on THIS side because the main thread cannot keep one: the
        // page hands a rendered frame over with a transfer list, which detaches
        // the buffer, so a single shared block of silence over there would work
        // exactly once and every later post would carry a detached buffer.
        //
        // Sharing one array across several queued frames is safe because
        // nothing here ever writes to a queued frame - the reader below takes
        // it and drops it - and each entry is consumed on its own cursor, so
        // two entries that are the same array play as two frames of silence.
        this.silence = new Int16Array (${SAMPLES_PER_FRAME});

        this.port.onmessage = (message) => {
            // A silent frame is a message with no buffer on it, and it takes a
            // queue slot like any other frame because what the queue really
            // holds is TIME. Dropped instead, the queue would drain 800 samples
            // early for every silent frame and the next sound would arrive
            // ahead of the frame it belongs to.
            this.queue.push (message.data.silent
                ? this.silence
                : message.data.samples);

            // A producer far ahead is a stall that already happened, and its
            // backlog is latency nothing gives back. Cut to QUEUE_DEPTH on
            // every message rather than only past some larger ceiling, which
            // is what makes it self correcting: a catch-up of eight steps
            // leaves the queue at three rather than at eight, so the run does
            // not spend the rest of its life at the depth of its worst moment.
            //
            // The OLDEST go, and that is what keeps the sound with the
            // picture: the frames dropped are the ones already late, and the
            // ones kept are the ones about to be drawn.
            //
            // Chosen over dropping the SILENT entries first, which would lose
            // no samples at all. Both are one frame of TIME, so either drop
            // moves the stream on by the same 16.7 ms and only one of them
            // also loses sound - but the join a dropped silence leaves is two
            // rendered frames meeting at whatever phase they happen to be at,
            // where a dropped rendered frame joins to zeros, and which of the
            // two clicks louder is not something anything here can measure.
            // So: one rule and one branch, in the one handler that has to stay
            // trivial because it runs on the audio thread.
            if (this.queue.length > QUEUE_DEPTH) {
                this.queue.splice (0, this.queue.length - QUEUE_DEPTH);
            }
        };
    }

    process (inputs, outputs) {
        const out = outputs [0] [0];

        // A render quantum is 128 samples and a console frame is 800, so the
        // two never line up: frames are handed over a quantum at a time.
        for (let i = 0; i < out.length; i++) {
            if (! this.pending || this.pendingAt >= this.pending.length) {
                this.pending = this.queue.shift () || null;
                this.pendingAt = 0;
            }

            // An empty queue is silence rather than a repeat: the game renders
            // what it means to sound, so inventing samples would be the host
            // making something up.
            out [i] = this.pending ? this.pending [this.pendingAt++] / 32768 : 0;
        }

        return true;
    }
}

registerProcessor ('samples', SamplePlayer);
`;

class Synth {
    constructor () {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)
            ({ sampleRate: SAMPLE_RATE });

        // Requesting a rate is standard but not guaranteed: a browser may hand
        // back the device's instead. The game renders at game_sample_rate
        // regardless, so a mismatch would play its audio at the wrong speed -
        // which is worth saying out loud rather than leaving to be noticed.
        if (this.ctx.sampleRate !== SAMPLE_RATE) {
            console.warn (`player: asked for ${SAMPLE_RATE} Hz, got `
                + `${this.ctx.sampleRate} Hz; audio will play at the wrong `
                + `rate on this machine.`);
        }

        this.node = null;

        this.master = this.ctx.createGain ();
        this.master.gain.value = 0.5;
        this.master.connect (this.ctx.destination);

        this.ready = this.start ();
    }

    async start () {
        try {
            // data:, not a blob: a blob URL fails on file:// - measured.
            await this.ctx.audioWorklet.addModule (
                "data:text/javascript," + encodeURIComponent (SAMPLE_PLAYER));

            this.node = new AudioWorkletNode (this.ctx, "samples", {
                numberOfInputs: 0,
                outputChannelCount: [1],
            });

            this.node.connect (this.master);
        } catch (error) {
            console.warn ("player: audio unavailable:", error);
        }
    }

    resume () { if (this.ctx.state !== "running") this.ctx.resume (); }

    // One message per step, carrying that frame's samples. The buffer is copied
    // because the game will overwrite it on the very next frame.
    play (samples) {
        if (this.node) this.node.port.postMessage ({ samples }, [samples.buffer]);
    }

    // The frame a game reported as `game_report_silent`, which is a message
    // with nothing attached to it.
    //
    // Owed rather than skipped, and the interface says why: a display latches
    // and a speaker does not, so the worklet is still owed 800 samples for this
    // frame and what it is owed is silence. Feeding it nothing starves the
    // queue and clicks, and repeating the last block would sound the frame rate
    // at 60 Hz, because a game whose state is not moving has a frozen
    // oscillator phase.
    //
    // A message rather than a block of zeros because `play` above hands its
    // buffer over with a transfer list, which DETACHES it - so one shared zero
    // array is posted once and every later post carries a detached buffer. The
    // alternative was a fresh 1,600 bytes per silent frame, which is an
    // allocation every frame for a game that is doing nothing, and that is
    // exactly the case this path exists to make cheap. The zeros live in the
    // worklet instead and this says which frame they are for.
    silence () { if (this.node) this.node.port.postMessage ({ silent: true }); }
}

// ---------------------------------------------------------------------------
// Main loop. Fixed 60 Hz step decoupled from the display refresh - a 120 Hz
// panel must not run the game at double speed.
// ---------------------------------------------------------------------------

const canvas = document.getElementById ("screen");
const context = canvas.getContext ("2d", { alpha: false });
const image = context.createImageData (FRAME_WIDTH, FRAME_HEIGHT);
const rgba = image.data;
rgba.fill (255);

// Nothing below runs until a module has been fetched, which is a round trip
// away rather than in hand: the page is built, then it waits. Everything the
// module decides - the game, its state block, its colours, its sound - hangs
// off `start`, and until then these are null and the HUD says so.

let wasmBytes = null;

// This page's own half of the plug-in ABI, compiled once and handed to every
// session and every task body. A game imports nothing, so the records a host
// composes point at wasm functions that came from here rather than at addresses
// - `installTrampoline` in `player.js` carries the whole argument. Fetched
// beside this page rather than beside a game, exactly as the decoder is: one
// page plays every game.
let trampoline = null;

// And the rulebook every host answers a spawn, an id's validity and a refused
// argument out of. The MODULE is held rather than an instance, because a
// session wants one of its own: an instance is a linear memory, and a reset is
// a new one - here as much as for the game beside it.
let core = null;

let session = null;
let synth = null;

// The queue itself is `Input`, in `player.js`, because what a key means to this
// console is a table rather than an event: these two listeners are the whole of
// what the browser contributes. `M`, `R`, `F`, `I` and `Enter` are the page's
// own and never reach it - the console has six buttons and none of them is one
// of these. Escape is nobody's here: the browser spends it leaving fullscreen.

const input = new Input ();

// Every event this console accepts is a reason for a resting game to be running
// again, and this is the whole of how it is told. On the QUEUE rather than on
// each listener below: a host waking from a list of event names has to be
// edited every time the console learns about one more, and the failure of
// forgetting one is a player pressing a key that never arrives. `wake` is a
// no-op on a game that is not resting, which is every frame of most runs.

input.onQueued = wake;

addEventListener ("keydown", event => {
    if (event.code === "KeyM") { mark (); return; }
    if (event.code === "KeyR") { reset (); return; }
    if (event.code === "KeyF") { toggleFullscreen (); return; }
    if (event.code === "KeyI") { toggleChrome (); return; }

    // Pause is `Enter` rather than Escape because the browser takes Escape to
    // leave fullscreen and does not give it back - the keydown arrives, but
    // `preventDefault` does not hold the exit off, so a pause bound to it would
    // fire every time the player left fullscreen. Measured in a browser, since
    // nothing in `ctest` can reach this.
    if (event.code === "Enter" || event.code === "NumpadEnter") {
        togglePause ();
        event.preventDefault ();

        return;
    }

    if (input.queue (event.timeStamp, event.code, true)) {
        event.preventDefault ();
    }
});
addEventListener ("keyup", event => {
    if (input.queue (event.timeStamp, event.code, false)) {
        event.preventDefault ();
    }
});

// The pointer, and on the canvas rather than on the window: a click on the HUD
// belongs to the page and a click on the screen belongs to the game. What each
// event MEANS is `player.js`'s - `pointerPixel` for the position, `POINTER_KEYS`
// for the button, the queue for the instant - by the same division that puts
// `KEYS` there. A bounding rectangle is the browser's; a column and a row are
// not.
//
// Every listener is installed whatever the game declared, and `Session.advance`
// is the one place a game reading no pointer stops being told about one. That is
// one code path rather than two, and it is also what leaves a tap free to stand
// in for a press of `a` on a game that has no pointer at all.

// Whether this pointer can report a position with nothing pressed, which is
// what `Game_Pointer.hovers` asks and the only thing the page says about the
// pointer that is not a position.
//
// `pointerType` is the browser's own answer and it is a fact rather than an
// inference: a mouse and a pen hover, a touch does not. Anything the browser
// will not name lands on the header's answer for a host that cannot tell,
// which is yes - so a device nobody has heard of behaves exactly as everything
// did before this existed.
//
// It is NOT the device reaching the game. What crosses is one bit saying what
// the channel can do, and `interface/game.h` is explicit that a game may only
// draw from it. The distinction is the whole reason there is no `touch` here.

function pointerHovers (event) {
    return event.pointerType !== "touch";
}

function track (event) {
    const pixel = pointerPixel (event.clientX, event.clientY,
        canvas.getBoundingClientRect ());

    input.queuePointer (event.timeStamp, event.pointerId, pixel.x, pixel.y,
        true, pointerHovers (event));
}

canvas.addEventListener ("pointermove", track);
canvas.addEventListener ("pointerenter", track);

canvas.addEventListener ("pointerdown", event => {
    // A press captures, so `present` holds from here to the release wherever
    // the pointer goes and the position clamps to the screen's edge. Touch
    // captures implicitly whether a host asks for it or not, so without this
    // line a mouse dragged off the canvas would go absent mid gesture where a
    // finger would not - two devices disagreeing at exactly the seam the header
    // promises they agree at.
    canvas.setPointerCapture (event.pointerId);

    track (event);

    input.queuePointerButton (event.timeStamp, event.pointerId,
        POINTER_KEYS [event.button], true);

    event.preventDefault ();
});

canvas.addEventListener ("pointerup", event => {
    track (event);

    input.queuePointerButton (event.timeStamp, event.pointerId,
        POINTER_KEYS [event.button], false);
});

// The system can take a pointer away - a palm on a phone, an edge gesture, a
// call arriving - and it does so with no `pointerup` to follow. Listening for
// the release alone would leave the button held for the rest of the run, so a
// cancellation releases both and takes the pointer off the screen.
canvas.addEventListener ("pointercancel", event => {
    for (const button of POINTER_BUTTONS) {
        input.queuePointerButton (event.timeStamp, event.pointerId, button,
            false);
    }

    input.queuePointer (event.timeStamp, event.pointerId, 0, 0, false,
        pointerHovers (event));
});

// Absent rather than stale: a pointer that has left the screen has no position,
// and a game told otherwise would draw its cursor somewhere nobody is pointing.
// While a press is captured this does not fire at all, which is the point of
// capturing it.
canvas.addEventListener ("pointerleave", event => {
    input.queuePointer (event.timeStamp, event.pointerId, 0, 0, false,
        pointerHovers (event));
});

// The second button reaches the game only if the browser's own menu does not
// take it first, and only where the game reads a pointer: suppressing the menu
// over a game that never sees the click would take it from the player for
// nothing.
canvas.addEventListener ("contextmenu", event => {
    if (session && session.controls.pointer !== NEED.none) {
        event.preventDefault ();
    }
});

// The double tap, which is iOS asking a question this page has already
// answered. `touch-action: none` on the canvas is meant to settle it - the
// declaration says that no gesture beginning on the screen is the browser's -
// and Safari zooms the page a step on two quick taps over it anyway, which on a
// game whose taps ARE its input is every other move. What survives the
// declaration does not survive a refusal: the zoom is raised off the second
// `touchend`, so cancelling that one event is the whole fix, and it is scoped
// to the canvas and to a second tap rather than turned on the page.
//
// PINCH is deliberately left alone. Zooming in past the window is an ordinary
// thing to do here - the `safe` alignment at the top of the page exists for it,
// and the sizing declines to refit on a zoom precisely so that a player who
// zoomed in stays zoomed in - so `user-scalable=no` in the viewport tag would
// have been the wrong answer even on the iOS versions that still honoured it.
// This takes the one gesture that collides with play and leaves the one that
// helps.
//
// What a cancelled `touchend` costs is the compatibility mouse events, and
// nothing on this canvas listens for one: the game's input is queued off the
// pointer events above, which a refused touch event does not cancel, and the
// audio unlock hangs off `pointerdown`. So the window can be generous - 350 ms
// rather than the 300 ms a double tap is usually quoted at - because
// overshooting it suppresses nothing anybody can see.

let lastTapEnd = 0;

canvas.addEventListener ("touchend", event => {
    if (event.timeStamp - lastTapEnd < 350) { event.preventDefault (); }

    lastTapEnd = event.timeStamp;
}, { passive: false });

// The canvas keeps its 240x240 backing store at every size: only the CSS box
// changes, and `image-rendering: pixelated` makes the browser's upscale a
// nearest neighbour one. How large that box is, and why it is counted in device
// pixels rather than CSS ones, is `canvasScale` in `player.js` - the arithmetic
// is numbers in and numbers out, so it lives on the far side of the browser
// like `pointerPixel` and the key table.
//
// The space the canvas cannot have is measured rather than assumed. It used to
// be a hard coded 120px, which was wrong at both ends: the real chrome is 84px
// on a wide window, which cost a whole step of scale between 1044 and 1079
// pixels of height, and the HUD wraps on a narrow one and grows past 150px.

const hud = document.getElementById ("hud");

// The part of that row the game decides. Looked up once beside the row it sits
// in; `describe` fills it, and until a module has been read it is empty.
const legendRow = document.getElementById ("legends");

function available () {
    const style = getComputedStyle (document.body);
    const horizontal =
        parseFloat (style.paddingLeft) + parseFloat (style.paddingRight);
    const gap = parseFloat (style.rowGap) || 0;

    // Counted rather than assumed, because the HUD comes and goes. Hidden it is
    // `display: none` and measures zero of its own accord - but the gap BESIDE
    // it goes with it, and a gap charged unconditionally would keep taking 14px
    // from a canvas that is now the only thing in the flow. Written over a list
    // because the page had two of these rows until the identity row went, and
    // one row is the case this arithmetic gets wrong when it is assumed.
    const rows = [hud].filter (row => ! row.hidden);

    const vertical = rows.reduce (
            (total, row) => total + row.getBoundingClientRect ().height,
            rows.length * gap)
        + parseFloat (style.paddingTop) + parseFloat (style.paddingBottom);

    return { width: innerWidth - horizontal, height: innerHeight - vertical };
}

// How far the page is zoomed is `pageZoom` in `player.js`, which takes the four
// numbers `reading` gathers and says what it does with a phone, where the outer
// pair is the screen rather than the window. It moved there when it stopped
// being a division: what a reading MEANS lives on the far side of this page's
// line, with `canvasScale` and the key table, and only the globals are here.

function fitCanvas () {
    const box = canvasScale (available (), devicePixelRatio,
        pageZoom (reading ()));

    canvas.style.width = box.width + "px";
    canvas.style.height = box.height + "px";

    // The box is a whole number of device pixels; where the centring PUTS it is
    // not, and `gridSnap` in `player.js` says what a box straddling the grid
    // costs and why the fix is a reading rather than an even number of pixels
    // of chrome. Cleared before it is measured, because what has to be read is
    // where the box lands with no correction on it - otherwise every fit reads
    // back the last fit's answer and corrects a fraction that is already gone.
    //
    // A transform rather than a margin, for two reasons that are both about
    // what it does NOT touch. It is not laid out, so it cannot feed back into
    // the centring it is cancelling; and `getBoundingClientRect` reports the
    // moved box, so `pointerPixel` needs to know nothing about any of this and
    // a click still lands on the console pixel under it.
    canvas.style.transform = "none";

    const placed = canvas.getBoundingClientRect ();

    canvas.style.transform = "translate("
        + gridSnap (placed.left, devicePixelRatio) + "px, "
        + gridSnap (placed.top, devicePixelRatio) + "px)";
}

// The two rows under the canvas, and whether they are there at all.
//
// Off by default, because what this page is for is the game. What is left in
// the row is an fps reading, the two legends naming the console's own buttons,
// and five page controls - none of it needed while playing, and every control
// carrying its key in its own label. `I` brings the lot back and `I` takes it
// away again.
//
// The `hidden` attribute rather than a class, because it is what `available`
// above reads to decide how much room the canvas has. One flag drives both the
// display and the arithmetic, so they cannot come to disagree.
//
// What is genuinely lost while it is off is discoverability: `M`, `R`, `F`,
// `Enter` and `I` itself all still work, and nothing on the page says so. That
// is the trade this default makes, and `I` is the way back to the legend.

function showChrome (shown) {
    hud.hidden = ! shown;

    // The canvas takes whatever is left, so it grows into the space the rows
    // gave up and shrinks when they come back. `fitCanvas` directly rather than
    // `onLayout`, because nothing about the WINDOW moved: `layoutChange` would
    // compare two identical readings, rightly answer `none`, and refit nothing.
    fitCanvas ();
    redraw ();
}

function toggleChrome () { showChrome (hud.hidden); }

// Both signals arrive here, and `layoutChange` in `player.js` decides which of
// them deserves a refit. A zoom does not: refitting on one is what made zooming
// out enlarge the game, and leaving the canvas alone is what lets the browser's
// own control scale it like anything else on the page.
//
// The reading is kept rather than recomputed because the decision is a
// comparison of two moments, and only the page can take either of them - every
// number in it is a browser global.
//
// The media query is the second signal because a display change can move the
// ratio without a `resize` at all. It matches only at the ratio it was built
// with, so any move away fires it once and it is re-armed at the new one. Its
// failure mode is silence rather than damage: at a ratio CSS rounds differently
// from the number here it simply never matches, and a `resize` still carries
// the cases that come with one.

let ratioWatch = null;
let lastLayout = null;

function reading () {
    return {
        outerWidth, outerHeight, innerWidth, innerHeight,
        ratio: devicePixelRatio,
    };
}

function watchRatio () {
    if (ratioWatch) { ratioWatch.removeEventListener ("change", onLayout); }

    ratioWatch = matchMedia (`(resolution: ${devicePixelRatio}dppx)`);
    ratioWatch.addEventListener ("change", onLayout);
}

function onLayout () {
    const now = reading ();
    const change = layoutChange (lastLayout, now);

    lastLayout = now;

    // Re-armed on every ratio move, whether or not it earned a refit: the query
    // has fired and is now watching a ratio the page has left, so skipping this
    // for a zoom would spend the one signal a display change has.
    if (change !== "none") { watchRatio (); }

    if (change === "window" || change === "display") { fitCanvas (); redraw (); }
}

// The first call has nothing to compare against, so it reports `window`, which
// both arms the query and lays the canvas out.

addEventListener ("resize", onLayout);
onLayout ();

// ---------------------------------------------------------------------------
// Fullscreen, which is the same `requestFullscreen` a video player calls: the
// real one, so the menu bar and the browser's own chrome go with it.
//
// It needs no arithmetic of its own. `available` MEASURES the chrome rather
// than assuming it and `canvasScale` takes whatever it reports, so fullscreen
// is an ordinary refit against a larger window - the console stays a whole
// multiple of device pixels, pillarboxed on a screen that is not square.
//
// `documentElement` rather than `body`: the UA stylesheet puts width and height
// of 100% on whichever element is fullscreened, and putting that on `<html>`
// leaves the body's own flex centring - the `safe center` above - to work
// exactly as it already does. A probe found no visible difference between the
// two, so this is the conservative one rather than the measured one.
//
// The transition is announced rather than inferred, and that is the whole of
// what this had to get right. `layoutChange` tells a resize from a zoom by
// whether `outerWidth`/`outerHeight` moved, and whether entering fullscreen
// moves them is a browser's business: where it does, the verdict is `window`
// and the refit happens; where it does not, the verdict is `zoom` and the page
// declines to refit, leaving the canvas at its windowed size on a full screen.
// Measured here it moves them, but that is one browser, and item 21 in
// `docs/decisions.md` already records `outerWidth` as unmeasured elsewhere.
//
// So the baseline is DROPPED instead, on the way IN. `layoutChange` returns
// `window` when it has nothing to compare against, which is how the first paint
// lays itself out; clearing `lastLayout` reuses that rule to force the refit
// rather than adding a branch to a function whose whole job is telling these
// cases apart. It is also why the ordering does not matter: `resize` was
// measured arriving AFTER `fullscreenchange`, so the call below may read the
// window before it has finished changing, and the resize that follows then
// refits against a baseline that is merely stale rather than wrong.
//
// LEAVING IS NOT THE SAME OPERATION AND MUST NOT FORCE A REFIT, which is a bug
// this page shipped. A refit reads the window in CSS pixels, and a CSS pixel is
// what page zoom moves - so the box `canvasScale` returns is only right at the
// zoom it was measured at. Every other path is kept away from that by
// `layoutChange` declining to refit on a zoom; forcing one here was the single
// door left open, and it let a zoom level be baked into the canvas.
//
// The sequence a player reported, and it reproduces in the arithmetic alone -
// `tests/layout.js` runs it. Zoom out, enter fullscreen, leave it: the forced
// refit runs against the zoomed-out reading, takes a much larger multiple, and
// sizes the canvas 1680 CSS px where 720 was right. Zoom back in and the page
// correctly declines to refit, so the canvas stays 1680 in a 1440 px window -
// wider than the window, with no way back to a sane size, because every further
// zoom is declined for the same good reason. It is not one browser's problem:
// the box is `240 * scale / ratio`, so Chrome moving the ratio with a zoom
// cancels against the smaller multiple it then takes, and both land on 1680.
//
// So leaving RESTORES the box the canvas had before fullscreen took the window,
// rather than working one out again. That box was computed at the windowed size
// and is still the right answer for it, and it carries the zoom it was measured
// at in the only way a CSS length can - by being a CSS length.
//
// What this does NOT cover, stated rather than left to be discovered: a zoom
// performed WHILE fullscreen is left to restore a box measured at the zoom
// before it. That is the same defect one level down, undoing it needs the zoom
// factor - which no browser reports - and it is a rarer sequence than the one
// above.

const fullButton = document.getElementById ("full");

function toggleFullscreen () {
    if (document.fullscreenElement) { document.exitFullscreen (); return; }

    // A rejected request is reported ON THE BUTTON rather than through
    // `refuse`, and the difference is whether the run survives it. `refuse` is
    // for a page that cannot go on - no module, bytes that are not wasm - so it
    // throws, and the handler at the top of this file replaces the HUD's
    // `textContent`, which takes the frame counter and all four buttons with
    // it. A declined fullscreen request is not that: the game is still playing
    // and every other control still works. The button the player just pressed
    // is where they are looking, it is the smallest thing that can carry the
    // answer, and the next successful change puts the label back.
    const request = document.documentElement.requestFullscreen ();

    if (request && request.catch) {
        request.catch (error => {
            fullButton.textContent = "Fullscreen refused";
            fullButton.title = error.message;
        });
    }
}

// The CSS box the canvas had while the page was a window, so that leaving
// fullscreen can put it back. Read off the element rather than recomputed,
// because what has to be restored is the box that was actually in use - the
// grid correction `fitCanvas` applied to it included.

let windowedBox = null;

document.addEventListener ("fullscreenchange", () => {
    fullButton.textContent =
        document.fullscreenElement ? "Exit fullscreen (F)" : "Fullscreen (F)";

    if (document.fullscreenElement) {
        windowedBox = {
            width: canvas.style.width,
            height: canvas.style.height,
            transform: canvas.style.transform,
        };

        lastLayout = null;
        onLayout ();
    }
    else if (windowedBox) {
        // The baseline still moves, because the window really did change size
        // and the next resize has to be measured against what is there now.
        // Only the refit is declined.
        lastLayout = reading ();

        canvas.style.width = windowedBox.width;
        canvas.style.height = windowedBox.height;
        canvas.style.transform = windowedBox.transform;

        windowedBox = null;
    }
    else {
        // Nothing saved means this handler never saw the page enter, which no
        // sequence here produces. Fitting is the safe answer rather than
        // leaving the canvas at a size that was measured for a whole screen.
        lastLayout = null;
        onLayout ();
    }

    // A resting game paints nothing, and a game that is running paints only
    // what it does not claim is unchanged - so from here on the canvas holds
    // the last frame drawn until the game itself moves a pixel. Nothing about a
    // fullscreen transition is visible to a game, so nothing about it can move
    // that claim, and the page repaints on its own account. `redraw` says what
    // that costs and why it is spent on a transition that may well not need it.
    redraw ();
});

// Hidden rather than left to fail: iPhone Safari has no element fullscreen at
// all - `<video>` there gets a native player nothing else is offered - and a
// button that does nothing is worse than one that is not there. `F` is left
// bound, because it is inert for the same reason and costs nothing.

if (! document.fullscreenEnabled) { fullButton.hidden = true; }

fullButton.addEventListener ("click", toggleFullscreen);

// The conversion is `paint`, in `player.js`, and so is the running record of
// which palette entries this run has put on screen; what is left here is the
// one call a browser is needed for. `putImageData` is therefore the only line
// of the whole screen path that nothing in `ctest` executes.

function present () {
    // `seen` is discarded here and the accumulator with it: the running record
    // of which palette entries a run has drawn had exactly one reader, and it
    // was the identity row. `plays.js` still carries it - a check comparing
    // withheld resources against delivered ones needs to know what reached the
    // screen - which is why `paint` still takes and returns it.
    paint (session.frame, session.palette, rgba, 0);

    context.putImageData (image, 0, 0);
}

// What a frame that ran puts on screen. Here rather than inline in the loop
// because the loop is no longer the only thing that steps the game: entering a
// pause runs one final frame, and a frame drawn by one caller and not the other
// would leave the pause showing the frame before it.
//
// `held` is the caller saying the pixels already on the canvas are this frame's
// too, which is `game_report_still` - accumulated over however many steps have
// run since the last paint, because a run of still frames only reaches back as
// far as the last frame that was not one. What it saves is `render_video`,
// `paint` and `putImageData` together, which is the whole screen path: a pass
// over 57,600 bytes into 230,400 and the upload behind it.
//
// It is an OBSERVATION the page may act on rather than an instruction it must
// obey, and the default says so: a caller with nothing to claim calls `draw ()`
// and gets the full render. Every path that can invalidate the canvas without
// the game's state moving takes that call, through `redraw` below.

function draw (held) {
    if (held) { return; }

    session.renderVideo (session.statePtr, session.videoPtr);
    present ();
}

// A full repaint, whatever the last frame claimed. For everything that changes
// what the canvas is or where it sits without any of it being visible to the
// game: a refit, entering or leaving fullscreen, the HUD coming and going, and
// coming back from a pause.
//
// None of those is KNOWN to need one. The canvas keeps its 240x240 backing
// store through every one of them - only writing `width` or `height` clears it
// - so this is a frame of the screen path spent against a class of failure that
// is silent, permanent and unreadable here: a page that has stopped painting
// shows the last thing it painted, and there is no browser in `ctest` to
// notice. The flag is a claim about the GAME's pixels and says nothing about
// the browser's, so the page keeps the right to disbelieve it.

function redraw () { if (session) { draw (); } }

// One step's worth of sound, which is the whole of what `game_report_silent`
// moves. Both callers that step the game go through it, so a report is turned
// into work in one place rather than in two that can drift apart.
//
// The call skipped is `render_audio`, and nothing else: the worklet is fed
// either way, because a speaker that is handed nothing runs its queue dry and
// clicks. `Synth.silence` is what that costs, which is a message and no bytes.

function playAudio (report) {
    if (report & REPORT.silent) { synth.silence (); return; }

    synth.play (session.renderSamples ());
}

// Mark: the playtest hook from the design. Packages the frame index, the
// arguments the run was given and the input log so the run can be replayed to
// exactly this frame.
//
// Mark, Reset and Pause are all live in the DOM before a module is, because the
// page is built once and every game hangs off it. Each answers for the run
// there is not yet, rather than for a null session.
function mark () {
    if (! session) { return; }

    // Space separated lines rather than JSON: the readers are C and this file,
    // and a line format costs six lines here while saving a hand written JSON
    // parser on the other side - the code standing between a corrupt replay and
    // a silently wrong one. Readers split on the first run of whitespace, so a
    // value may contain spaces and no quoting rule is needed.
    //
    // The `seed` line is the number this run really used: the address carries
    // it by the time a frame has been drawn, whether a reader wrote it or
    // `composeRun` rolled it, so a recording reproduces a run rather than
    // re-rolling it - by construction rather than by a rule somebody has to
    // remember.
    //
    // Then one `arg <name> <value>` line per pair this run passed through,
    // sorted by name, which is the order they were delivered in - a recording
    // and a delivery are one list, so a reader on another machine produces the
    // same bytes and the same array. An EMPTY value is the name with nothing
    // after it, which is the format's own spelling for the one value that is
    // not absence, and a bare run writes no `arg` line at all - a reader that
    // finds none supplies none.
    //
    // The `save` line between them carries the blob this run was CONSTRUCTED
    // from, and only where that blob had a non-zero byte. It is what was
    // delivered rather than a reference to the store it came out of, so a mark
    // taken here reproduces on a machine whose `localStorage` holds something
    // else or nothing at all - and a run handed nothing writes no line, which
    // is why every replay in this tree older than the record is still valid
    // unchanged. `Session.saveLines` holds both halves of that rule.
    const lines = [
        `game ${session.name}`,
        `version ${session.version.join (".")}`,
        `seed ${session.seed}`,
        ...session.saveLines (),
        ...session.argLines (),
        `frame ${session.frameIndex}`,
    ];
    // Merged by frame rather than one log after the other. Both readers keep a
    // cursor per record kind, so either order parses - but a file read by a
    // person should run forwards in time.
    //
    // A task's answer is recorded beside the buttons because it is the same
    // kind of thing: an edge at a frame boundary that the game branches on. The
    // game SAMPLES a level rather than catching that edge, but the frame the
    // level changes on is still the host's decision, so a replay that left it
    // out would reproduce the run with the answers never arriving,
    // deterministically and wrongly. A failure is recorded for the stronger
    // version of that reason - an absence cannot be pinned at all, so a run
    // where a task never answered is replayable only as a record.
    //
    // By ID rather than by name, and nothing else about a task goes in: a
    // descriptor carries a name nothing resolves through, and the spawn
    // re-fires from the same state on the same frame - so a replay runs the
    // body again and regenerates the output rather than carrying a
    // computation's answer in a file meant to outlive the build that made it.
    //
    // A RESOURCE has no record of its own here and never will: a body reads a
    // file off the frame and a replay re-runs the body, so there is no schedule
    // to reproduce. What pins the bytes is the identity a completion carries -
    // the filename the host handed the body, its length and a fold of it.
    //
    // Every record this page writes says `none` there, which is the format's
    // spelling for "this record pins no delivery", and it is honest rather than
    // lazy: the page FETCHES over HTTP and holds decoded bytes rather than
    // files it read, so it has nothing to fold and no filename to fold it
    // under. A reader cannot tell that from a body that was handed no file, and
    // is not meant to - both mean there is nothing here to check against. So a
    // recording taken here replays and verifies nothing about its resources,
    // which is exactly what the page could say about them before.
    //
    // The pointer is here for the first reason and is written as a change, like
    // `input`: a position is piecewise constant, so a record means "here from
    // this frame until the next one". Leaving the screen is written as `away`
    // rather than as a position nobody is at, because absence is a thing the
    // reader has to reproduce and every coordinate on the screen is a legal one.
    const records = [
        ...session.inputLog.map (e =>
            ({ frame: e.frame, kind: "input", text: e.buttons.join (" ") })),
        ...session.tapLog.map (e =>
            ({ frame: e.frame, kind: "tap", text: e.buttons.join (" ") })),
        ...session.taskLog.map (e =>
            ({ frame: e.frame, kind: e.kind, text: `${e.id} none` })),
        ...session.pointerLog.map (e => ({ frame: e.frame, kind: "pointer",
            text: e.present ? `${e.x} ${e.y}` : "away" })),
    ].sort ((x, y) => x.frame - y.frame);

    for (const record of records) {
        lines.push (`${record.kind} ${record.frame}`
            + (record.text ? ` ${record.text}` : ""));

    const blob = new Blob ([lines.join ("\n") + "\n"], { type: "text/plain" });
    const a = document.createElement ("a");
    a.href = URL.createObjectURL (blob);
    a.download = session.name.toLowerCase () + "-mark-" + session.frameIndex + ".replay";
    a.click ();
    URL.revokeObjectURL (a.href);
}

function reset () {
    if (! wasmBytes) { return; }

    // What the outgoing session leaves behind, in the order the two have to
    // happen in.
    //
    // Its store first, because a reset is a new run rather than a lost one: the
    // game about to be built reads that store back in `construct`, so without
    // this a player who pressed R and then closed the tab would have the reset
    // run recorded and the run before it forgotten.
    //
    // Then every worker it is still holding - one per body in the air - because
    // a thread running a body for a game that no longer exists is a core spent
    // on an answer nothing will read, and its message would reach a linear
    // memory nothing is playing out of.
    if (session) {
        session.writeSave ();

        session.runner.stop ();
    }

    // The worker's URL is the PLAYER's rather than the module's, exactly as the
    // decoder's is and for the same reason: one page plays every game, so a
    // file resolved against a game would have to be copied into every game's
    // directory to be found. Handed over rather than left out, because a
    // session without it runs bodies on this thread - correct, and the page
    // frozen for the length of a search, which is the whole thing tasks exist
    // to remove.
    // The resource directory goes with it, because a body reads its own files
    // now: the session posts the directory to a body's worker with the module,
    // and every fetch a run makes happens on that thread inside the read that
    // wanted it. A new session is a new set of workers and a new linear memory,
    // so nothing a previous run fetched is still reachable and nothing has to be
    // invalidated - the bytes are fetched again, which is one round trip and
    // never a stale pointer.
    //
    // The seed and the arguments are the one thing that does NOT come back new:
    // the same number and the same list every reset, decided once out of the
    // address above, so that the address bar describes what is on screen for
    // the whole life of the page and R is a reset rather than a reroll. The
    // MEMORY the pairs live in is new every time, because a new session is a
    // new linear memory - which is what keeps laying them down once per session
    // from leaking.
    //
    // The STORE is the one thing here that outlives the page, and it is handed
    // over rather than reached for by `Session` so that every other host in the
    // tree gets a session with none: `goldenhash.js`, `plays.js` and every
    // replay construct from zeros and write nothing, which is what keeps a test
    // run from moving anybody's browser. Null where this browser has storage
    // turned off, which is a page that plays and forgets rather than a page
    // that refuses.
    session = new Session (wasmBytes, trampoline, new HostCore (core), runSeed,
        runArguments,
        new URL ("task.worker.js", location.href).href,
        { base: resourceDirectory.href },
        saveStore);

    // The other half of what ends a rest, and the half a game cannot cause: a
    // task becomes ready under a game whose state had no other reason to move,
    // so a page asleep on that game's promise would sleep through the one thing
    // it was waiting for. Assigned per session because `reset` builds a new one,
    // and a stale session's answers reach a linear memory nothing is playing out
    // of any more.
    session.onStaged = wake;

    describe ();

    // A new run has everything to do, whatever the old one had run out of.
    // `paused` and `hidden` are deliberately left alone - resetting is not
    // unpausing, and a reset behind a menu is still behind it - but a game that
    // no longer exists cannot be the reason the loop is stopped.
    wake ();
}

// The one place the game's declared colour becomes the page's. `theme` is in
// `player.js` and does the whole derivation; what is left here is the browser's
// half of it - writing custom properties, which is the page's own vocabulary,
// and `color-scheme`, which is what makes the browser's scrollbars and its
// focus rings follow a game that chose a pale surround.
//
// Custom properties on `documentElement` rather than a stylesheet swap, so the
// fallback block at the top of this file stays the one writer of what these
// mean and this is only new values for them. It is also what a refusal falls
// back to: `refuse` throws before a session exists, so the page keeps its own
// dark chrome and says so in `--alarm` rather than on whatever the game wanted.

function applyTheme () {
    const colours = theme (session.palette, session.background);
    const root = document.documentElement;

    for (const [name, value] of Object.entries (colours)) {
        if (name === "light") { continue; }

        root.style.setProperty (`--${name}`, value);
    }

    root.style.colorScheme = colours.light ? "light" : "dark";
}

// What the page does with the identity it read out of the module, which is now
// almost nothing: a title, the colours, the cursor and the keycap legends.
//
// The legends are the one of the four that is advice rather than appearance,
// and they are here because they are read out of the module exactly as the
// other three are - `Game_Controls` arrives through the same hand-mirrored
// `LAYOUT` block as the name and the palette do.
//
// This used to restate the whole of it on screen - name, version, state size,
// controls, what it had loaded, palette entries drawn - and the argument for
// that was that every one of those values arrives through the hand-mirrored
// `LAYOUT` block, so a mirror that had drifted from `interface/game.h` showed
// up as a wrong name or an impossible state size in front of a reader, rather
// than as a game quietly misbehaving.
//
// That reader is now `web_player_plays_<game>`, which compares all five against
// what `inspector info` reads out of the native plug-in through the console - a
// wholly separate path, checked on every run rather than whenever somebody
// happens to look. The row was the only reader when it was written and is not
// the only reader now, which is what made it affordable to delete.

function describe () {
    // What is left of the identity the page read out of the module, now that
    // the row that showed the rest is gone: the tab still carries the name and
    // the version, which is the one place a person can tell two games apart
    // without playing them.
    document.title = `${session.name} ${session.version.join (".")}`;

    applyTheme ();
    applyCursor ();

    fillLegends (legendRow, session.controls, document);
}

// A cursor the browser draws is on screen and NOT in the framebuffer, so it is
// outside the golden, outside `inspector shot` and outside every mechanism this
// tree has for knowing what was drawn. A game that reads the pointer draws its
// own, and this is where the browser's stops competing with it.
//
// It comes back while paused, because the player has stopped aiming at the game
// and started aiming at the page: Mark, Reset and the browser's own chrome are
// all targets then, and a hidden cursor over them takes something from the
// player for nothing. There is no moment when both are drawn - the game's own
// went with the frame `stepPointerAway` ran - so the two hand over cleanly in
// each direction.

function applyCursor () {
    canvas.style.cursor =
        session && ! halt.paused && session.controls.pointer !== NEED.none
            ? "none"
            : "";
}

// Pause is the host's, like Mark and Reset, and the game is never told: the
// console has six buttons and Enter is not one of them. Stepping stops, so a
// paused run produces no frames and a mark taken across one still replays
// exactly - with the single exception `stepPointerAway` below describes, which
// is one real frame delivered as the pause begins.
//
// Three independent reasons not to be stepping, and `halted` and `haltChange`
// in `player.js` hold what each of them means. `Enter` moves `paused`, page

// `idle`; the loop runs when none of them is set.

const halt = { paused: false, hidden: false, idle: false };

//
// Not the instant it rests, and the case that says so is the ordinary one: a
// game that thinks between moves is idle between every move, so suspending on
// the first resting frame and resuming on the next press would cycle the audio
// hardware once per move for the whole run. A suspend and a resume are not free
// either - `resume` is asynchronous, the platform may have powered the output
// down in between, and `docs/decisions.md` records a blocked `resume` here

// fullscreen request that spent the page's user activation and silenced the
// game.
//

// are worth naming because nothing here can settle it. Too short and a thinking
// player pays a context cycle a move. Too long and a page parked on a title
// screen holds a real-time audio thread for nothing, which is one of the three

//
// The game is never told it is paused, and its cursor's position lives in its
// own state, so a paused game goes on drawing a crosshair while the OS pointer
// comes back over the top of it - two cursors, one of which is aimed at
// nothing. Neither obvious way out is available here. Telling the game would
// make its state depend on the host, which is the objection that rejected a
// nullable `input` in `step` and a deadline the game could see. Dimming or
// overlaying the canvas would put host chrome over the console, which is what
// rejected the HTML splash overlay.
//
// So the POINTER leaves instead, and the game is stepped once on that. It costs
// one real frame; it records as an ordinary `pointer <n> away` and replays
// exactly; and it is indistinguishable from the player having moved the mouse
// off the canvas, which is effectively what has happened. Resume needs no
// counterpart - the next ordinary step picks the pointer up again if it is
// there.

// is already off the screen: the frame exists to change what the game sees, and
// there it would change nothing.

function stepPointerAway () {
    if (session.controls.pointer === NEED.none) { return; }

    // Drained first, or the release below is applied and then immediately
    // overwritten by whatever the queue was still holding.
    input.applyUpTo (Infinity);

    if (! input.pointer.present) { input.clearEdges (); return; }

    input.releasePointer ();

    const report = session.advance (input.buttons, input.edges, input.pointer);

    input.clearEdges ();

    // Honoured here as in the loop, and for one reason rather than for
    // symmetry: this frame exists to take the game's own cursor off the screen,
    // so a game that draws one reports pixels that moved and is painted, and a
    // game that draws none reports `game_report_still` and has nothing for the
    // page to paint. Either way the claim is about the frame that just ran.
    playAudio (report);
    draw (report & REPORT.still);
}

// The one writer of all three flags. Idempotent by construction, since
// `haltChange` reports nothing for a flag that did not move - which is load
// bearing rather than tidy, because `pagehide` and `visibilitychange` can both
// fire for one navigation and a toggle would take the second as a request to
// start playing again behind the menu.
//
// The flags move even with no session, so a page hidden while its module is
// still arriving does not come back running. Only the actions need one.

function setHalt (change) {
    const before = { ...halt };

    Object.assign (halt, change);

    // A move of either of the player's own two flags clears the game's.
    //
    // `idle` is the loop's reading of a game, and every one of these
    // transitions moves something that reading was taken under: the pointer
    // `stepPointerAway` sends away, the buttons `shedInput` drops, the frames a
    // hidden tab never ran. Re-deriving it costs one step of a game that is
    // about to be stepped anyway.
    //
    // It also closes the one way this could strand a run. `halted` is the OR of
    // the three, so an `idle` that survived a hide would still be set when
    // `hidden` cleared, the loop would not start, and nothing the player could
    // press would be an input event this page still had a reason to look at.
    // The flag has to be cleared by whatever put the game beyond its reach, and
    // that is these two and nothing else.
    if (change.paused !== undefined || change.hidden !== undefined) {
        halt.idle = false;
    }

    const { shed, run, sound } = haltChange (before, halt);

    // honest. The button is the only thing that says whether the run is paused
    // now that the separate indicator is gone, and everything below the return
    // needs a session and a synth where this needs neither: `Enter` pressed
    // while the module is still being fetched pauses a run that has not started
    // yet, and a label written after the return would still read `Pause` on a
    // page that was already paused.
    //
    // On the button rather than beside it, the way the fullscreen button
    // already carries its own state: a separate indicator would be a second
    // writer of one fact, and this way the control a reader is looking at is
    // the thing that says what it will do next.
    //
    // `halt.paused` alone, never `halted (halt)`. The other reason not to be

    // at - and a button that read `Resume` on returning to a tab would be

    pauseButton.textContent = halt.paused ? "Resume (Enter)" : "Pause (Enter)";

    // runs while anything is halted, so nothing drains the queue during a pause

    // frame ran. It is applied so a key released during the pause is not still
    // held on resume, and its edges are dropped so the backlog does not fire as
    // one burst on the first frame back. A game that was merely RESTING is
    // deliberately not in this list: nothing was taken from the player there,
    // and the press that woke it is the press it is owed.
    if (shed === "stepped") { stepPointerAway (); }
    else if (shed === "quiet") { shedInput (); }
    else if (shed === "backlog") {

    // Emitting nothing means sustain, so a game that stops stepping mid-note
    // would drone on. Suspending stops the worklet outright.

    // A game resting is the one halt the sound leaves slowly - `AUDIO_GRACE`
    // above holds why, and what the number is a judgement between.
    //
    // The state is read again when the timer fires rather than trusted. Five
    // seconds is a long time on this page and everything that could have
    // happened in it - a press, a resource landing, a pause, a navigation -
    // comes through here and cancels this; what is left is the ordinary case of
    // a game that woke and rested again, which arrives as `start` and then
    // `rest` and replaces the timer. The re-read is what makes a timer that
    // outlives its reason harmless rather than a game silenced while playing.
    if (sound === "rest") {

    // Inside the handler that woke the page, which is what makes this legal on
    // a platform that gates `resume` behind user activation: the wake is an
    // input event, so the gesture is in hand. A wake by a resource landing has
    // none, and there the persistent unlock listeners `start` installs are what
    // retry it on the player's next gesture - the same mechanism, for the same
    // reason, as the fullscreen key that used to spend the activation.
    if (sound === "start") { cancelAudioRest (); synth.resume (); }

    if (run === "stop") { stopLoop (); }

    if (run === "start") {

        // does not fire in a hidden tab, so the first one after the page comes
        // back carries every second it was away - and the accumulator would
        // spend that on a catch-up of up to eight steps the player never
        // played. A game waking from rest is the same sentence with a different
        // clock: nothing was owed for the time it spent resting, because
        // nothing was going to happen in it.
        last = 0;
        accumulator = 0;

        // page has had no way to know what happened to it since - a fullscreen
        // transition, a refit, a browser repainting a background tab. The flag
        // says nothing about any of that, so the run starts with a frame nobody
        // is claiming anything about.
        redraw ();

}

// The game has something to react to again, so the loop starts if it had
// stopped. Called from wherever something can reach a running game - the input
// queue accepting an event, a resource landing - rather than from a list of
// event names, because the failure of missing one is a player pressing a key
// that never arrives.
//
// Cheap and idempotent by design: `haltChange` reports nothing for a flag that

// three comparisons. It is deliberately not gated on `halt.idle`, because a
// gate is a second reader of the flag and this way there is one.

function wake () { setHalt ({ idle: false }); }

// Everything the browser will now never finish telling us about. The pointer's
// presence goes too, unlike `blur` below: a page behind something is not being
// aimed at, where an unfocused window still has a mouse sitting over it.

function shedInput () {
    input.applyUpTo (Infinity);
    input.releaseButtons ();
    input.releasePointer ();
    input.clearEdges ();
